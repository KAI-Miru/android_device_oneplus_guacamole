name: Guacamole H.40 V4 hybrid compile/link gate

on:
  push:
    branches:
      - codex/guacamole-twrp12-v4-hybrid
    paths:
      - ".github/workflows/guacamole-h40-v4-compile.yml"
      - "ci/twrp-oplus-h40-decrypt.patch"
      - "ci/apply-h40-v4-hybrid.py"
      - "ci/verify-h40-adapter-elf.sh"
      - "BoardConfig.mk"
      - "device.mk"
      - "twrp_guacamole.mk"
  pull_request:
    branches:
      - codex/guacamole-twrp12-v3-artifact-fix
    paths:
      - ".github/workflows/guacamole-h40-v4-compile.yml"
      - "ci/twrp-oplus-h40-decrypt.patch"
      - "ci/apply-h40-v4-hybrid.py"
      - "ci/verify-h40-adapter-elf.sh"
      - "BoardConfig.mk"
      - "device.mk"
      - "twrp_guacamole.mk"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guacamole-h40-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-link-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      DEVICE_PATH: device/oneplus/guacamole
      COMMON_PATH: device/oneplus/sm8150-common
      ONEPLUS_COMMON_PATH: device/oneplus/common
      KERNEL_PATH: kernel/oneplus/sm8150
      RECOVERY_REVISION: 5c3d206a5eeb3d446bcda8248a405a4b278bab5c
      V3_PATCH_REL: ci/twrp-oplus-h40-decrypt.patch
      V3_PATCH_SHA256: 81046f75eea3b1445f8e994cd9b6b62a48de8799bc4777dd2a2c3ec70e391020
      V4_TRANSFORM_REL: ci/apply-h40-v4-hybrid.py
      BUILD_TARGET: recovery
      RECOVERY_BINARY_REL: out/target/product/guacamole/recovery/root/system/bin/recovery
      BUILD_JOBS: "4"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "TWRP CI"
          git config --global user.email "twrp-ci@users.noreply.github.com"

      - name: Sync pinned TWRP 12.1 tree
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" init --depth=1 \
            --manifest-url "$MANIFEST_URL" \
            --manifest-branch "$MANIFEST_BRANCH"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/oneplus.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_bootable_recovery"
                            path="bootable/recovery"
                            revision="$RECOVERY_REVISION" />
            <project path="$DEVICE_PATH"
                     name="${GITHUB_REPOSITORY}"
                     remote="github"
                     revision="${GITHUB_SHA}"
                     clone-depth="1" />
            <project path="$COMMON_PATH"
                     name="TeamWin/android_device_oneplus_sm8150-common"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
            <project path="$ONEPLUS_COMMON_PATH"
                     name="LineageOS/android_device_oneplus_common"
                     remote="github"
                     revision="lineage-18.1"
                     clone-depth="1" />
            <project path="$KERNEL_PATH"
                     name="nebrassy/android_kernel_oneplus_sm8150"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
          </manifest>
          EOF
          "$HOME/bin/repo" sync --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --fail-fast -j"$BUILD_JOBS"

      - name: Apply reviewed V3 then V4 hybrid transform
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          recovery_actual="$(git -C bootable/recovery rev-parse HEAD)"
          test "$recovery_actual" = "$RECOVERY_REVISION"

          v3_patch="$PWD/$DEVICE_PATH/$V3_PATCH_REL"
          v4_transform="$PWD/$DEVICE_PATH/$V4_TRANSFORM_REL"
          printf '%s  %s\n' "$V3_PATCH_SHA256" "$v3_patch" | sha256sum --check -
          python3 -m py_compile "$v4_transform"

          git -C bootable/recovery apply --check --index --whitespace=error-all "$v3_patch"
          git -C bootable/recovery apply --index --whitespace=error-all "$v3_patch"
          python3 "$v4_transform" "$PWD/bootable/recovery"
          git -C bootable/recovery add -- \
            Android.mk oplus_h40_decrypt.cpp oplus_h40_decrypt.hpp partitionmanager.cpp
          git -C bootable/recovery diff --cached --check

          grep -Fq 'Oplus H.40 v4 hybrid activated; TWRP owns metadata mapping, OEM owns DE/CE' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'PrepareMetadataRuntime' bootable/recovery/oplus_h40_decrypt.hpp
          if grep -Fq 'api.mount_metadata(mount_point)' bootable/recovery/oplus_h40_decrypt.cpp; then
            echo 'V4 must not invoke the Oplus metadata mapper' >&2
            exit 1
          fi
          grep -Fq 'android::vold::fscrypt_mount_metadata_encrypted' \
            bootable/recovery/partitionmanager.cpp

          printf '\n# CI-only: compile/link the H.40 V4 hybrid adapter.\n' \
            >> "$DEVICE_PATH/BoardConfig.mk"
          printf 'TW_INCLUDE_OPLUS_H40_DECRYPT := true\n' \
            >> "$DEVICE_PATH/BoardConfig.mk"

          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_revision=${GITHUB_SHA}"
            echo "recovery_base=$recovery_actual"
            echo "v3_patch_sha256=$(sha256sum "$v3_patch" | awk '{print $1}')"
            echo "v4_transform_sha256=$(sha256sum "$v4_transform" | awk '{print $1}')"
            echo "recovery_v4_tree=$(git -C bootable/recovery write-tree)"
            echo "metadata_mapper=TeamWin_android_system_vold"
            echo "de_ce_backend=Oplus_H40_libdecrypt_recovery"
            echo "runtime_requirement=keystore2-v4"
          } | tee "$GITHUB_WORKSPACE/build-provenance.txt"
          git -C bootable/recovery diff --cached --stat \
            | tee "$GITHUB_WORKSPACE/recovery-v4-diffstat.txt"

      - name: Configure V4 gate
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          test "$(get_build_var TW_INCLUDE_OPLUS_H40_DECRYPT)" = true

      - name: Compile and link V4 recovery executable
        id: build
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          mka "$BUILD_TARGET" -j"$BUILD_JOBS" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify V4 ELF and source markers
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/twrp/$RECOVERY_BINARY_REL"
          bash "$RUNNER_TEMP/twrp/$DEVICE_PATH/ci/verify-h40-adapter-elf.sh" \
            "$binary" "$GITHUB_WORKSPACE"
          strings -a "$binary" > "$GITHUB_WORKSPACE/h40-v4-recovery.strings"
          grep -Fq 'Oplus H.40 v4 hybrid activated; TWRP owns metadata mapping, OEM owns DE/CE' \
            "$GITHUB_WORKSPACE/h40-v4-recovery.strings"
          grep -Fq 'Oplus H.40 v4 hybrid adopting TWRP metadata mapping' \
            "$GITHUB_WORKSPACE/h40-v4-recovery.strings"
          grep -Fq 'FS_IOC_GET_ENCRYPTION_KEY_STATUS' \
            "$GITHUB_WORKSPACE/h40-v4-recovery.strings"
          if grep -Fq 'Oplus H.40 invoking metadata mount for' \
            "$GITHUB_WORKSPACE/h40-v4-recovery.strings"; then
            echo 'OEM metadata invocation marker survived into V4 binary' >&2
            exit 1
          fi

      - name: Package V4 recovery artifact
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/twrp/$RECOVERY_BINARY_REL"
          mkdir -p "$GITHUB_WORKSPACE/h40-v4-recovery"
          cp "$binary" "$GITHUB_WORKSPACE/h40-v4-recovery/recovery"
          cp "$GITHUB_WORKSPACE/build-provenance.txt" "$GITHUB_WORKSPACE/h40-v4-recovery/"
          cp "$GITHUB_WORKSPACE/adapter-verification.txt" "$GITHUB_WORKSPACE/h40-v4-recovery/"
          cp "$GITHUB_WORKSPACE/recovery-elf.sha256" "$GITHUB_WORKSPACE/h40-v4-recovery/" || true
          sha256sum "$binary" | tee "$GITHUB_WORKSPACE/h40-v4-recovery/recovery-v4.sha256"

      - name: Upload V4 recovery artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-h40-adapter-v4-recovery
          path: h40-v4-recovery/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload V4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-h40-v4-compile-diagnostics
          path: |
            build-provenance.txt
            recovery-v4-diffstat.txt
            build.log
            recovery-elf-header.txt
            recovery-dynamic-section.txt
            recovery-dt-needed.txt
            recovery-adapter-strings.txt
            recovery-elf.sha256
            recovery-elf-metadata.txt
            adapter-verification.txt
            h40-v4-recovery.strings
          if-no-files-found: warn
          retention-days: 14
