name: Guacamole H.40 V4.1 Actions run dump

on:
  pull_request:
    branches:
      - codex/guacamole-twrp12-v41-hidl-clean

permissions:
  contents: read
  actions: read

jobs:
  dump-main-runs:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Dump V4.1 main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: guacamole-h40-v41-hidl-compile.yml
          TARGET_BRANCH: codex/guacamole-twrp12-v41-hidl-clean
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?branch=${TARGET_BRANCH}&event=push&per_page=20"
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > "$RUNNER_TEMP/v41-main-runs.json"
          python3 - "$RUNNER_TEMP/v41-main-runs.json" <<'PY'
import json
import sys

with open(sys.argv[1], encoding="utf-8") as fh:
    runs = json.load(fh).get("workflow_runs", [])
for run in runs:
    print(
        "V41_MAIN_RUN",
        f"id={run['id']}",
        f"head_sha={run['head_sha']}",
        f"status={run['status']}",
        f"conclusion={run.get('conclusion') or 'pending'}",
        f"created_at={run['created_at']}",
        f"url={run['html_url']}",
    )
PY
