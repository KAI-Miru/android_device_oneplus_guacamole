name: Guacamole H.40 stock-first TWRP boot

on:
  push:
    branches:
      - android-12.1-latest-snapshot
    paths:
      - ".github/workflows/build-recovery.yml"
      - "build/h40/**"
      - "prebuilt/h40/**"
      - "recovery/root/**"
      - "Android.bp"
      - "AndroidProducts.mk"
      - "BoardConfig.mk"
      - "device.mk"
      - "system.prop"
      - "twrp_guacamole.mk"
      - "twrp.dependencies"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guacamole-h40-stock-first-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      DEVICE_PATH: device/oneplus/guacamole
      COMMON_PATH: device/oneplus/sm8150-common
      RECOVERY_REVISION: 5c3d206a5eeb3d446bcda8248a405a4b278bab5c
      VOLD_REVISION: a164ba05c5fef288059774a776b2e6e1119957cf
      SECURITY_REVISION: 14737db1429b8eebc15568bc748b2cd79ccad5c2
      NATIVE_REVISION: 89c808424fbce9e40c0d4e0d1920b3c64a191b7f
      BOOT_PARTITION_SIZE: "100663296"
      BUILD_JOBS: "4"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "TWRP CI"
          git config --global user.email "twrp-ci@users.noreply.github.com"

      - name: Sync pinned TWRP source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" init --depth=1 \
            --manifest-url "$MANIFEST_URL" \
            --manifest-branch "$MANIFEST_BRANCH"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/oneplus-guacamole.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_bootable_recovery"
                            path="bootable/recovery"
                            revision="$RECOVERY_REVISION" />
            <extend-project name="android_system_vold"
                            path="system/vold"
                            revision="$VOLD_REVISION" />
            <extend-project name="android_system_security"
                            path="system/security"
                            revision="$SECURITY_REVISION" />
            <extend-project name="platform/frameworks/native"
                            path="frameworks/native"
                            revision="$NATIVE_REVISION" />
            <project path="$DEVICE_PATH"
                     name="${GITHUB_REPOSITORY}"
                     remote="github"
                     revision="${GITHUB_SHA}"
                     clone-depth="1" />
            <project path="$COMMON_PATH"
                     name="TeamWin/android_device_oneplus_sm8150-common"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
          </manifest>
          EOF
          "$HOME/bin/repo" sync --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --fail-fast -j"$BUILD_JOBS"
          test "$(git -C bootable/recovery rev-parse HEAD)" = "$RECOVERY_REVISION"
          test "$(git -C system/vold rev-parse HEAD)" = "$VOLD_REVISION"
          test "$(git -C system/security rev-parse HEAD)" = "$SECURITY_REVISION"
          test "$(git -C frameworks/native rev-parse HEAD)" = "$NATIVE_REVISION"

      - name: Verify repository and pinned H.40 inputs
        run: |
          set -euo pipefail
          device="$RUNNER_TEMP/twrp/$DEVICE_PATH"
          python3 "$device/build/h40/verify-ramdisk-text.py"
          python3 "$device/build/h40/stock-first/verify_prebuilts.py" \
            --prebuilt-dir "$device/prebuilt/h40" \
            --manifest "$device/prebuilt/h40/manifest.json" \
            --report "$GITHUB_WORKSPACE/prebuilt-verification.json"
          printf '%s  %s\n' \
            a9ec360fc5395db9b72d36c03af59ff984f4eefcc349dc32a556de7f8ed892ab \
            "$device/build/h40/stock-first/avbtool_android-12.1.0_r4.py" \
            | sha256sum --check -
          python3 -m py_compile "$device/build/h40/"*.py "$device/build/h40/stock-first/"*.py
          for obsolete in \
              "$device/audio" \
              "$device/bluetooth" \
              "$device/overlay" \
              "$device/overlay-aicp" \
              "$device/rootdir" \
              "$device/recovery/root/system/bin" \
              "$device/recovery/root/vendor/etc" \
              "$device/recovery/root/vendor/lib64" \
              "$device/recovery/root/init.recovery.usb.rc"; do
            test ! -e "$obsolete"
          done
          git -C "$device" diff --check

      - name: Apply reviewed H.40 patch set
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          patch_dir="$PWD/$DEVICE_PATH/build/h40/patches"
          (
            cd "$patch_dir"
            sha256sum --check <<'EOF'
          c196b8bd497039ae9ec7587212d47e0fe105867982b4ee06a02bbe30507b464e  recovery.patch
          034b64defe6e7ff10b91e8948e0f2ac19da3a7f434bb03e9e6351fba283f2cda  vold.patch
          0cd8269b20fa83fcfff42eee02a6a0be8a0d8a74bb2ee9baba8449dc26441523  security.patch
          bc1398b4901403a33d7ad80a171ba95974ba2c938558bc10b69ff350e8850895  binder.patch
          EOF
          )
          git -C bootable/recovery apply --check --index --whitespace=error-all "$patch_dir/recovery.patch"
          git -C bootable/recovery apply --index --whitespace=error-all "$patch_dir/recovery.patch"
          git -C system/vold apply --check --index --whitespace=error-all "$patch_dir/vold.patch"
          git -C system/vold apply --index --whitespace=error-all "$patch_dir/vold.patch"
          git -C system/security apply --check --index --whitespace=error-all "$patch_dir/security.patch"
          git -C system/security apply --index --whitespace=error-all "$patch_dir/security.patch"
          git -C frameworks/native apply --check --index --whitespace=error-all "$patch_dir/binder.patch"
          git -C frameworks/native apply --index --whitespace=error-all "$patch_dir/binder.patch"
          for repository in bootable/recovery system/vold system/security frameworks/native; do
            git -C "$repository" diff --cached --check
          done
          grep -Fq '[H40 PORTIDENTITY] using mounted dynamic system' bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '[OPLUS V56 LAYOUT]' system/vold/FsCrypt.cpp
          grep -Fq 'H40_RECOVERY_KEYSTORE2_PERMISSION_SHIM_V51' system/security/keystore2/src/utils.rs
          grep -Fq 'H40_RECOVERY_BINDER_STABILITY_V0_V52' frameworks/native/libs/binder/Parcel.cpp
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "recovery_base=$RECOVERY_REVISION"
            echo "vold_base=$VOLD_REVISION"
            echo "security_base=$SECURITY_REVISION"
            echo "frameworks_native_base=$NATIVE_REVISION"
            echo "stock_boot_sha256=991cf738f5a6dc874c6261fa073c89182e61935a9493dc27347699c4d0a68792"
            echo "commondcs_source=ColorOS_12.1_H.40_system_ext"
            echo "commondcs_sha256=e9ea4b62cd235b095a9da141276cf30add2c20acb73c6aa2cfd7bc0c9d6cc464"
            sha256sum "$patch_dir"/*.patch
          } | tee "$GITHUB_WORKSPACE/build-provenance.txt"

      - name: Configure and assert recovery build
        run: |
          # Android's envsetup.sh intentionally probes unset shell variables.
          # Keep errexit and pipefail here, but do not enable nounset.
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          assert_eq() {
            local name="$1" expected="$2" actual
            actual="$(get_build_var "$name")"
            [[ "$actual" == "$expected" ]] || {
              echo "Expected $name=$expected, got '$actual'" >&2
              exit 1
            }
          }
          assert_eq TARGET_PRODUCT twrp_guacamole
          assert_eq TARGET_DEVICE guacamole
          assert_eq TARGET_NO_KERNEL false
          assert_eq TARGET_FORCE_PREBUILT_KERNEL true
          assert_eq TARGET_KERNEL_SOURCE ""
          assert_eq BOARD_USES_RECOVERY_AS_BOOT true
          assert_eq TARGET_NO_RECOVERY true
          assert_eq BOARD_BOOT_HEADER_VERSION 2
          assert_eq BOARD_INCLUDE_RECOVERY_DTBO true
          assert_eq BOARD_BOOTIMAGE_PARTITION_SIZE "$BOOT_PARTITION_SIZE"
          assert_eq TARGET_PREBUILT_KERNEL "$DEVICE_PATH/prebuilt/h40/kernel"
          assert_eq TARGET_PREBUILT_DTB "$DEVICE_PATH/prebuilt/h40/dtb.img"
          assert_eq BOARD_PREBUILT_DTBOIMAGE "$DEVICE_PATH/prebuilt/h40/recovery-dtbo.img"
          assert_eq TW_INCLUDE_OPLUS_H40_DECRYPT true
          assert_eq TW_EXTRA_LANGUAGES true
          if grep -Fq 'device/oneplus/common' \
              <<<"$(get_build_var PRODUCT_SOONG_NAMESPACES)"; then
            echo "obsolete full-ROM OnePlus common namespace survived" >&2
            exit 1
          fi

      - name: Compile and link recovery
        id: build
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          mka recovery -j"$BUILD_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Stage compiled payload failsafe
        id: compiled_failsafe
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/twrp/out/target/product/guacamole/recovery/root/system"
          destination="$RUNNER_TEMP/guacamole-coloros-compiled-payload"
          mkdir -p "$destination/system/bin" "$destination/system/lib64"
          for name in recovery oplus_h40_credential_helper keystore2; do
            test -x "$source_root/bin/$name"
            install -m 0755 "$source_root/bin/$name" "$destination/system/bin/$name"
          done
          if test -x "$source_root/bin/linker64"; then
            install -m 0755 "$source_root/bin/linker64" "$destination/system/bin/linker64"
          fi
          for name in libbinder.so libbinder_ndk.so; do
            if test -f "$source_root/lib64/$name"; then
              install -m 0644 "$source_root/lib64/$name" "$destination/system/lib64/$name"
            fi
          done
          (
            cd "$destination"
            find system -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload compiled payload failsafe
        if: ${{ always() && steps.compiled_failsafe.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guacamole-coloros-compiled-payload
          path: ${{ runner.temp }}/guacamole-coloros-compiled-payload/
          if-no-files-found: error
          retention-days: 7

      - name: Build matching recovery linker
        id: runtime_linker
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          mka linker.recovery -j"$BUILD_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/linker-recovery-build.log"
          test -x out/target/product/guacamole/recovery/root/system/bin/linker64

      - name: Verify compiled recovery and helpers
        id: elf_gate
        if: ${{ always() && steps.runtime_linker.outcome == 'success' }}
        run: |
          set -euo pipefail
          recovery_root="$RUNNER_TEMP/twrp/out/target/product/guacamole/recovery/root"
          report="$GITHUB_WORKSPACE/elf-report"
          bash "$RUNNER_TEMP/twrp/$DEVICE_PATH/build/h40/verify-recovery-elf.sh" \
            "$recovery_root/system/bin/recovery" "$report"
          strings -a "$recovery_root/system/bin/recovery" > "$report/recovery.strings"
          strings -a "$recovery_root/system/bin/keystore2" > "$report/keystore2.strings"
          strings -a "$recovery_root/system/lib64/libbinder.so" > "$report/libbinder.strings"
          grep -Fq '[H40 V51 PARENT]' "$report/recovery.strings"
          grep -Fq '[OPLUS V56 LAYOUT]' "$report/recovery.strings"
          grep -Fq 'H40_RECOVERY_KEYSTORE2_PERMISSION_SHIM_V51' "$report/keystore2.strings"
          grep -Fq 'H40_RECOVERY_BINDER_STABILITY_V0_V52' "$report/libbinder.strings"

      - name: Assemble and verify complete H.40 boot image
        id: stock_first
        if: ${{ always() && steps.elf_gate.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          product_root="out/target/product/guacamole"
          recovery_root="$product_root/recovery/root"
          device="$DEVICE_PATH"
          stage="$RUNNER_TEMP/guacamole-h40-stage"
          work="$RUNNER_TEMP/guacamole-h40-stock-first"
          ready="$RUNNER_TEMP/guacamole-h40-ready"
          mkdir -p "$stage" "$ready"

          install -D -m 0644 "$device/recovery/root/twres/splash.xml" "$recovery_root/twres/splash.xml"
          install -D -m 0644 "$device/recovery/root/twres/images/mirumiru.png" \
            "$recovery_root/twres/images/mirumiru.png"
          test -x out/host/linux-x86/bin/mkbootfs
          out/host/linux-x86/bin/mkbootfs "$recovery_root" > "$stage/twrp.cpio"

          output_name='guacamole-H40-stock-first-TWRP-ColorOS-RC3-TEST.img'
          bash "$device/build/h40/stock-first/build_full_boot.sh" \
            --twrp-cpio "$stage/twrp.cpio" \
            --twrp-tree "$recovery_root" \
            --recovery-root "$recovery_root" \
            --work-dir "$work" \
            --output "$ready/$output_name"

          install -m 0644 \
            "$work/prebuilt-verification.json" \
            "$work/stock-assemble.json" \
            "$work/private-overlay.json" \
            "$work/stock-patch-overlay.json" \
            "$work/cryptoeng-overlay.json" \
            "$work/recovery-fixes-cpio.json" \
            "$work/runtime-cpio.json" \
            "$work/boot-repack.json" \
            "$work/verification.json" \
            "$work/avb-info.txt" \
            "$ready/"
          cat > "$ready/DEVICE-TEST.txt" <<'EOF'
          GUACAMOLE COLOROS H.40 STOCK-FIRST TWRP BOOT IMAGE

          CI reconstructed the exact H.40 boot baseline, installed the audited
          private TWRP/ColorOS runtime, added and verified the boot AVB footer,
          and independently checked the final 96 MiB image. Test with fastboot
          boot before any flashing or release publication.
          EOF
          (
            cd "$ready"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload complete H.40 boot image
        if: ${{ always() && steps.stock_first.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guacamole-H40-stock-first-TWRP-ColorOS-DEVICE-TEST
          path: ${{ runner.temp }}/guacamole-h40-ready/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guacamole-coloros-build-diagnostics
          path: |
            prebuilt-verification.json
            build-provenance.txt
            build.log
            linker-recovery-build.log
            elf-report/
            ${{ runner.temp }}/guacamole-h40-stock-first/hybrid-base-verification.json
            ${{ runner.temp }}/guacamole-h40-stock-first/avb-verify.txt
          if-no-files-found: warn
          retention-days: 14
