name: Guacamole H.40 V4.1 direct-HIDL compile/link gate

on:
  push:
    branches:
      - codex/guacamole-twrp12-v41-hidl-clean
    paths:
      - ".github/workflows/guacamole-h40-v41-hidl-compile.yml"
      - "ci/twrp-oplus-h40-decrypt.patch"
      - "ci/apply-h40-v4-hybrid.py"
      - "ci/apply-h40-v4-failclosed.py"
      - "ci/apply-h40-v41-hidl.py"
      - "ci/verify-h40-adapter-elf.sh"
      - "BoardConfig.mk"
      - "device.mk"
      - "twrp_guacamole.mk"

permissions:
  contents: read

concurrency:
  group: guacamole-h40-v41-hidl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-link-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      DEVICE_PATH: device/oneplus/guacamole
      COMMON_PATH: device/oneplus/sm8150-common
      ONEPLUS_COMMON_PATH: device/oneplus/common
      KERNEL_PATH: kernel/oneplus/sm8150
      RECOVERY_REVISION: 5c3d206a5eeb3d446bcda8248a405a4b278bab5c
      VOLD_REVISION: a164ba05c5fef288059774a776b2e6e1119957cf
      HIDL_REFERENCE_REVISION: f0f84e9646c303db32dc38e5c8faaa93cecf4736
      V3_PATCH_REL: ci/twrp-oplus-h40-decrypt.patch
      V3_PATCH_SHA256: 81046f75eea3b1445f8e994cd9b6b62a48de8799bc4777dd2a2c3ec70e391020
      V41_TRANSFORM_REL: ci/apply-h40-v41-hidl.py
      BUILD_TARGET: recovery
      RECOVERY_BINARY_REL: out/target/product/guacamole/recovery/root/system/bin/recovery
      BUILD_JOBS: "4"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "TWRP CI"
          git config --global user.email "twrp-ci@users.noreply.github.com"

      - name: Sync pinned TWRP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" init --depth=1 \
            --manifest-url "$MANIFEST_URL" \
            --manifest-branch "$MANIFEST_BRANCH"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/oneplus-v41.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_bootable_recovery"
                            path="bootable/recovery"
                            revision="$RECOVERY_REVISION" />
            <extend-project name="android_system_vold"
                            path="system/vold"
                            revision="$VOLD_REVISION" />
            <project path="$DEVICE_PATH"
                     name="${GITHUB_REPOSITORY}"
                     remote="github"
                     revision="${GITHUB_SHA}"
                     clone-depth="1" />
            <project path="$COMMON_PATH"
                     name="TeamWin/android_device_oneplus_sm8150-common"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
            <project path="$ONEPLUS_COMMON_PATH"
                     name="LineageOS/android_device_oneplus_common"
                     remote="github"
                     revision="lineage-18.1"
                     clone-depth="1" />
            <project path="$KERNEL_PATH"
                     name="nebrassy/android_kernel_oneplus_sm8150"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
          </manifest>
          EOF
          "$HOME/bin/repo" sync --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --fail-fast -j"$BUILD_JOBS"

          test "$(git -C bootable/recovery rev-parse HEAD)" = "$RECOVERY_REVISION"
          test "$(git -C system/vold rev-parse HEAD)" = "$VOLD_REVISION"

      - name: Checkout pinned direct-HIDL reference outside Soong tree
        run: |
          set -euo pipefail
          ref="$RUNNER_TEMP/h40-vold-hidl-reference"
          rm -rf "$ref"
          git init "$ref"
          git -C "$ref" remote add origin https://github.com/4accccc/android_system_vold.git
          git -C "$ref" fetch --depth=1 origin "$HIDL_REFERENCE_REVISION"
          git -C "$ref" checkout --detach FETCH_HEAD
          test "$(git -C "$ref" rev-parse HEAD)" = "$HIDL_REFERENCE_REVISION"

          # The reference is input data only. It must never be visible to Soong,
          # otherwise its Android.bp duplicates the real system/vold modules.
          test ! -e "$RUNNER_TEMP/twrp/external/h40-vold-hidl-reference"

      - name: Apply reviewed V3, V4 hybrid, and V4.1 HIDL transform
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"

          v3_patch="$PWD/$DEVICE_PATH/$V3_PATCH_REL"
          v41_transform="$PWD/$DEVICE_PATH/$V41_TRANSFORM_REL"
          hidl_reference="$RUNNER_TEMP/h40-vold-hidl-reference"

          printf '%s  %s\n' "$V3_PATCH_SHA256" "$v3_patch" | sha256sum --check -
          python3 -m py_compile \
            "$PWD/$DEVICE_PATH/ci/apply-h40-v4-hybrid.py" \
            "$PWD/$DEVICE_PATH/ci/apply-h40-v4-failclosed.py" \
            "$v41_transform"

          git -C bootable/recovery apply --check --index --whitespace=error-all "$v3_patch"
          git -C bootable/recovery apply --index --whitespace=error-all "$v3_patch"

          python3 "$v41_transform" \
            "$PWD/bootable/recovery" \
            "$PWD/system/vold" \
            "$hidl_reference"

          git -C bootable/recovery add -- \
            Android.mk oplus_h40_decrypt.cpp oplus_h40_decrypt.hpp partitionmanager.cpp
          git -C system/vold add -- Android.bp Keymaster.cpp Keymaster.h
          git -C bootable/recovery diff --cached --check
          git -C system/vold diff --cached --check

          grep -Fq 'Oplus H.40 v4 hybrid activated; TWRP owns metadata mapping, OEM owns DE/CE' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'Oplus H.40 v4.1 metadata backend: direct HIDL Keymaster 4.0' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'IKeymasterDevice40::getService("default")' system/vold/Keymaster.cpp
          if grep -Fq 'AServiceManager_waitForService' system/vold/Keymaster.cpp; then
            echo 'V4.1 metadata Keymaster still contains Keystore2 AIDL wait path' >&2
            exit 1
          fi
          if grep -Fq 'api.mount_metadata(mount_point)' bootable/recovery/oplus_h40_decrypt.cpp; then
            echo 'V4.1 must not invoke Oplus metadata mapper' >&2
            exit 1
          fi
          if grep -Fq 'keystore2-v4' bootable/recovery/oplus_h40_decrypt.cpp; then
            echo 'V4.1 must not depend on the V4.0 keystore2-v4 runtime' >&2
            exit 1
          fi

          # Guard the exact failure seen in run 32529573084.
          if find "$PWD" -path '*/h40-vold-hidl-reference/Android.bp' -print -quit | grep -q .; then
            echo 'HIDL reference Android.bp leaked into the Soong source tree' >&2
            exit 1
          fi

          printf '\n# CI-only: compile/link the H.40 V4.1 direct-HIDL adapter.\n' \
            >> "$DEVICE_PATH/BoardConfig.mk"
          printf 'TW_INCLUDE_OPLUS_H40_DECRYPT := true\n' \
            >> "$DEVICE_PATH/BoardConfig.mk"

          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_revision=${GITHUB_SHA}"
            echo "recovery_base=$(git -C bootable/recovery rev-parse HEAD)"
            echo "vold_base=$VOLD_REVISION"
            echo "hidl_reference=$HIDL_REFERENCE_REVISION"
            echo "v3_patch_sha256=$(sha256sum "$v3_patch" | awk '{print $1}')"
            echo "v41_transform_sha256=$(sha256sum "$v41_transform" | awk '{print $1}')"
            echo "recovery_v41_tree=$(git -C bootable/recovery write-tree)"
            echo "vold_v41_tree=$(git -C system/vold write-tree)"
            echo "metadata_format=TeamWin_four_file_KeyStorage"
            echo "metadata_keymaster=H40_Keymaster_4_0_HIDL_default"
            echo "de_ce_backend=Oplus_H40_libdecrypt_recovery"
            echo "keystore2_runtime=not_required"
            echo "hidl_reference_location=outside_soong_tree"
          } | tee "$GITHUB_WORKSPACE/build-provenance.txt"

          # These must remain identical to the source trees from failed run
          # 32529573084; this retry changes only reference checkout placement.
          test "$(git -C bootable/recovery write-tree)" = be1c8eeb357b7115992bac45388ef870a6761873
          test "$(git -C system/vold write-tree)" = 7e15845f3881900e31ef5ac755332535cab82d69

          git -C bootable/recovery diff --cached --stat \
            | tee "$GITHUB_WORKSPACE/recovery-v41-diffstat.txt"
          git -C system/vold diff --cached --stat \
            | tee "$GITHUB_WORKSPACE/vold-v41-diffstat.txt"
          git -C system/vold diff --cached -- Keymaster.cpp Keymaster.h Android.bp \
            > "$GITHUB_WORKSPACE/vold-v41.patch"

      - name: Configure V4.1 gate
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          test "$(get_build_var TW_INCLUDE_OPLUS_H40_DECRYPT)" = true

      - name: Compile and link V4.1 recovery executable
        id: build
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          mka "$BUILD_TARGET" -j"$BUILD_JOBS" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify V4.1 ELF and backend contract
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/twrp/$RECOVERY_BINARY_REL"
          test -f "$binary"

          bash "$RUNNER_TEMP/twrp/$DEVICE_PATH/ci/verify-h40-adapter-elf.sh" \
            "$binary" "$GITHUB_WORKSPACE"

          strings -a "$binary" > "$GITHUB_WORKSPACE/h40-v41-recovery.strings"
          readelf --dynamic --wide "$binary" > "$GITHUB_WORKSPACE/h40-v41-dynamic.txt"
          awk '/\(NEEDED\)/ { line=$0; sub(/^.*Shared library: \[/,"",line); sub(/\].*$/,"",line); print line }' \
            "$GITHUB_WORKSPACE/h40-v41-dynamic.txt" \
            > "$GITHUB_WORKSPACE/h40-v41-dt-needed.txt"

          grep -Fq 'Oplus H.40 v4.1 metadata backend: direct HIDL Keymaster 4.0' \
            "$GITHUB_WORKSPACE/h40-v41-recovery.strings"
          grep -Fq '[Keymaster] Trying default keymaster 4.0 service...' \
            "$GITHUB_WORKSPACE/h40-v41-recovery.strings"
          grep -Fq 'I:Oplus H.40 v4 hybrid activated; TWRP owns metadata mapping, OEM owns DE/CE' \
            "$GITHUB_WORKSPACE/h40-v41-recovery.strings"
          grep -Fq 'E:Oplus H.40 v4 TWRP metadata mapping failed after runtime activation; refusing FDE fallback' \
            "$GITHUB_WORKSPACE/h40-v41-recovery.strings"

          if grep -Fq 'Vold unable to connect to keystore2.' \
            "$GITHUB_WORKSPACE/h40-v41-recovery.strings"; then
            echo 'crashing Keystore2 metadata Keymaster wrapper survived into V4.1' >&2
            exit 1
          fi
          if grep -Fq 'I:Oplus H.40 invoking metadata mount for %s' \
            "$GITHUB_WORKSPACE/h40-v41-recovery.strings"; then
            echo 'old Oplus metadata invocation survived into V4.1' >&2
            exit 1
          fi
          grep -Fqx 'android.hardware.keymaster@4.0.so' \
            "$GITHUB_WORKSPACE/h40-v41-dt-needed.txt"
          grep -Fqx 'libkeymaster4support.so' \
            "$GITHUB_WORKSPACE/h40-v41-dt-needed.txt"
          if grep -Fqx 'libdecrypt_recovery.so' \
            "$GITHUB_WORKSPACE/h40-v41-dt-needed.txt"; then
            echo 'recovery has forbidden hard DT_NEEDED on libdecrypt_recovery.so' >&2
            exit 1
          fi

          sha256sum "$binary" | tee "$GITHUB_WORKSPACE/recovery-v41.sha256"
          {
            echo 'result=pass'
            echo 'adapter_version=v4.1-direct-hidl'
            echo 'metadata_format=TeamWin-four-file'
            echo 'metadata_keymaster=android.hardware.keymaster@4.0::IKeymasterDevice/default'
            echo 'keystore2_runtime=not_required'
            echo 'oem_metadata_mapper=absent'
            echo 'oem_de_ce_backend=present'
          } | tee "$GITHUB_WORKSPACE/v41-verification.txt"

      - name: Package V4.1 recovery artifact
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/twrp/$RECOVERY_BINARY_REL"
          out="$GITHUB_WORKSPACE/h40-v41-recovery"
          mkdir -p "$out"
          cp "$binary" "$out/recovery"
          cp "$GITHUB_WORKSPACE/build-provenance.txt" "$out/"
          cp "$GITHUB_WORKSPACE/v41-verification.txt" "$out/"
          cp "$GITHUB_WORKSPACE/recovery-v41.sha256" "$out/"
          cp "$GITHUB_WORKSPACE/recovery-adapter-strings.txt" "$out/" || true
          cp "$GITHUB_WORKSPACE/recovery-dt-needed.txt" "$out/" || true

      - name: Upload V4.1 recovery artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-h40-adapter-v41-hidl-recovery
          path: h40-v41-recovery/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload V4.1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-h40-v41-hidl-diagnostics
          path: |
            build-provenance.txt
            recovery-v41-diffstat.txt
            vold-v41-diffstat.txt
            vold-v41.patch
            build.log
            recovery-elf-header.txt
            recovery-dynamic-section.txt
            recovery-dt-needed.txt
            recovery-adapter-strings.txt
            recovery-elf.sha256
            recovery-elf-metadata.txt
            adapter-verification.txt
            h40-v41-recovery.strings
            h40-v41-dynamic.txt
            h40-v41-dt-needed.txt
            recovery-v41.sha256
            v41-verification.txt
          if-no-files-found: warn
          retention-days: 14
