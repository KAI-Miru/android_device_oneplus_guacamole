# Historical filename retained so existing workflow links and dispatches stay valid.
name: Guacamole H.40 V5.1 parent keystorage and private keystore2

on:
  push:
    branches:
      - codex/guacamole-twrp12-v42-blobprobe
    paths:
      - ".github/workflows/guacamole-h40-v50-modern-keystorage-compile.yml"
      - "ci/twrp-oplus-h40-decrypt.patch"
      - "ci/apply-h40-v41-hidl.py"
      - "ci/apply-h40-v41-kmcompat.py"
      - "ci/apply-h40-v42-blobprobe.py"
      - "ci/apply-h40-v43-blobprefix-base.py"
      - "ci/apply-h40-v44-upgradeparams-base.py"
      - "ci/apply-h40-v46-portidentity.py"
      - "ci/apply-h40-v46-fscrypt-lazy.py"
      - "ci/apply-h40-v46-export-prefix.py"
      - "ci/apply-h40-v46-depath.py"
      - "ci/apply-h40-v47-fscrypt-keyring.py"
      - "ci/apply-h40-v47-depath.py"
      - "ci/apply-h40-v48-secondary-user.py"
      - "ci/apply-h40-v48-depath.py"
      - "ci/apply-h40-v49-credential-helper.py"
      - "ci/apply-h40-v49-depath.py"
      - "ci/h40-v49/**"
      - "ci/apply-h40-v50-modern-keystorage.py"
      - "ci/apply-h40-v50-depath.py"
      - "ci/h40-v50/**"
      - "ci/apply-h40-v51-parent-keystorage.py"
      - "ci/apply-h40-v51-keystore2-recovery-permissions.py"
      - "ci/validate-h40-v51-keystore2-recovery-permissions.py"
      - "ci/package-h40-v51-keystore2-runtime.py"
      - "recovery/root/twres/**"
      - "BoardConfig.mk"
      - "device.mk"
      - "twrp_guacamole.mk"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guacamole-h40-v51-parent-keystorage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-link-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      DEVICE_PATH: device/oneplus/guacamole
      COMMON_PATH: device/oneplus/sm8150-common
      ONEPLUS_COMMON_PATH: device/oneplus/common
      KERNEL_PATH: kernel/oneplus/sm8150
      RECOVERY_REVISION: 5c3d206a5eeb3d446bcda8248a405a4b278bab5c
      VOLD_REVISION: a164ba05c5fef288059774a776b2e6e1119957cf
      SECURITY_REVISION: 14737db1429b8eebc15568bc748b2cd79ccad5c2
      V47_VOLD_TREE: a7ae1303e2a96019b529cb091517135c2e93ed49
      HIDL_REFERENCE_REVISION: f0f84e9646c303db32dc38e5c8faaa93cecf4736
      V3_PATCH_SHA256: 81046f75eea3b1445f8e994cd9b6b62a48de8799bc4777dd2a2c3ec70e391020
      IMMUTABLE_DEFAULT_SHA: abef9b8a105c9feee847a6b4ed0903bda8ffb5f9
      BUILD_JOBS: "4"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "TWRP CI"
          git config --global user.email "twrp-ci@users.noreply.github.com"

      - name: Verify immutable default branch
        run: |
          set -euo pipefail
          actual=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/android-12.1 | awk '{print $1}')
          test "$actual" = "$IMMUTABLE_DEFAULT_SHA"
          echo "android-12.1=$actual"

      - name: Sync pinned TWRP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" init --depth=1 \
            --manifest-url "$MANIFEST_URL" \
            --manifest-branch "$MANIFEST_BRANCH"
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/oneplus-v51-parent-keystorage.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_bootable_recovery"
                            path="bootable/recovery"
                            revision="$RECOVERY_REVISION" />
            <extend-project name="android_system_vold"
                            path="system/vold"
                            revision="$VOLD_REVISION" />
            <extend-project name="android_system_security"
                            path="system/security"
                            revision="$SECURITY_REVISION" />
            <project path="$DEVICE_PATH"
                     name="${GITHUB_REPOSITORY}"
                     remote="github"
                     revision="${GITHUB_SHA}"
                     clone-depth="1" />
            <project path="$COMMON_PATH"
                     name="TeamWin/android_device_oneplus_sm8150-common"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
            <project path="$ONEPLUS_COMMON_PATH"
                     name="LineageOS/android_device_oneplus_common"
                     remote="github"
                     revision="lineage-18.1"
                     clone-depth="1" />
            <project path="$KERNEL_PATH"
                     name="nebrassy/android_kernel_oneplus_sm8150"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
          </manifest>
          EOF
          "$HOME/bin/repo" sync --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --fail-fast -j"$BUILD_JOBS"
          test "$(git -C bootable/recovery rev-parse HEAD)" = "$RECOVERY_REVISION"
          test "$(git -C system/vold rev-parse HEAD)" = "$VOLD_REVISION"
          test "$(git -C system/security rev-parse HEAD)" = "$SECURITY_REVISION"

      - name: Checkout pinned V4.1 source reference
        run: |
          set -euo pipefail
          ref="$RUNNER_TEMP/h40-vold-hidl-reference"
          rm -rf "$ref"
          git init "$ref"
          git -C "$ref" remote add origin https://github.com/4accccc/android_system_vold.git
          git -C "$ref" fetch --depth=1 origin "$HIDL_REFERENCE_REVISION"
          git -C "$ref" checkout --detach FETCH_HEAD
          test "$(git -C "$ref" rev-parse HEAD)" = "$HIDL_REFERENCE_REVISION"

      - name: Apply V3 through V5.1 compatibility transforms
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          v3_patch="$PWD/$DEVICE_PATH/ci/twrp-oplus-h40-decrypt.patch"
          base_transform="$PWD/$DEVICE_PATH/ci/apply-h40-v41-hidl.py"
          km_fix="$PWD/$DEVICE_PATH/ci/apply-h40-v41-kmcompat.py"
          v43="$PWD/$DEVICE_PATH/ci/apply-h40-v43-blobprefix-base.py"
          v44="$PWD/$DEVICE_PATH/ci/apply-h40-v44-upgradeparams-base.py"
          blobprobe="$PWD/$DEVICE_PATH/ci/apply-h40-v42-blobprobe.py"
          portidentity="$PWD/$DEVICE_PATH/ci/apply-h40-v46-portidentity.py"
          fscrypt_lazy="$PWD/$DEVICE_PATH/ci/apply-h40-v46-fscrypt-lazy.py"
          export_prefix="$PWD/$DEVICE_PATH/ci/apply-h40-v46-export-prefix.py"
          v46="$PWD/$DEVICE_PATH/ci/apply-h40-v46-depath.py"
          v47_keyring="$PWD/$DEVICE_PATH/ci/apply-h40-v47-fscrypt-keyring.py"
          v47="$PWD/$DEVICE_PATH/ci/apply-h40-v47-depath.py"
          v48_secondary_user="$PWD/$DEVICE_PATH/ci/apply-h40-v48-secondary-user.py"
          v48="$PWD/$DEVICE_PATH/ci/apply-h40-v48-depath.py"
          v49_helper="$PWD/$DEVICE_PATH/ci/apply-h40-v49-credential-helper.py"
          v49="$PWD/$DEVICE_PATH/ci/apply-h40-v49-depath.py"
          v49_assets="$PWD/$DEVICE_PATH/ci/h40-v49"
          v50_modern_keystorage="$PWD/$DEVICE_PATH/ci/apply-h40-v50-modern-keystorage.py"
          v50="$PWD/$DEVICE_PATH/ci/apply-h40-v50-depath.py"
          v50_assets="$PWD/$DEVICE_PATH/ci/h40-v50"
          v51_parent="$PWD/$DEVICE_PATH/ci/apply-h40-v51-parent-keystorage.py"
          v51_policy="$PWD/$DEVICE_PATH/ci/apply-h40-v51-keystore2-recovery-permissions.py"
          v51_policy_validator="$PWD/$DEVICE_PATH/ci/validate-h40-v51-keystore2-recovery-permissions.py"
          v51_packager="$PWD/$DEVICE_PATH/ci/package-h40-v51-keystore2-runtime.py"
          hidl_reference="$RUNNER_TEMP/h40-vold-hidl-reference"

          printf '%s  %s\n' "$V3_PATCH_SHA256" "$v3_patch" | sha256sum --check -
          python3 -m py_compile \
            "$base_transform" "$km_fix" "$v43" "$v44" "$blobprobe" \
            "$portidentity" "$fscrypt_lazy" "$export_prefix" "$v46" \
            "$v47_keyring" "$v47" "$v48_secondary_user" "$v48" \
            "$v49_helper" "$v49" "$v50_modern_keystorage" "$v50" \
            "$v51_parent" "$v51_policy" "$v51_policy_validator" "$v51_packager"
          git -C bootable/recovery apply --check --index --whitespace=error-all "$v3_patch"
          git -C bootable/recovery apply --index --whitespace=error-all "$v3_patch"

          python3 "$base_transform" \
            "$PWD/bootable/recovery" "$PWD/system/vold" "$hidl_reference"
          python3 "$km_fix" "$PWD/bootable/recovery" "$PWD/system/vold"
          python3 "$v49" "$PWD/bootable/recovery" "$PWD/system/vold"

          # V4.9 does not alter vold after the physically validated V4.7 stack.
          # Stage that boundary before V5.0 adds its guarded Decrypt.cpp change.
          git -C system/vold add -- .
          v49_vold_tree=$(git -C system/vold write-tree)
          test "$v49_vold_tree" = "$V47_VOLD_TREE"

          python3 "$v50_modern_keystorage" \
            "$PWD/bootable/recovery" "$PWD/system/vold"
          python3 "$v51_parent" \
            "$PWD/bootable/recovery" "$PWD/system/vold"
          python3 "$v51_policy" "$PWD/system/security"
          python3 "$v51_policy_validator" "$PWD/system/security"

          git -C bootable/recovery add -- \
            Android.mk oplus_h40_decrypt.cpp oplus_h40_decrypt.hpp \
            oplus_h40_credential_protocol.hpp oplus_h40_credential_client.hpp \
            oplus_h40_credential_client.cpp oplus_h40_credential_helper.cpp \
            partitionmanager.cpp
          git -C system/vold add -- .
          git -C system/security add -- .
          git -C bootable/recovery diff --cached --check
          git -C system/vold diff --cached --check
          git -C system/security diff --cached --check

          # Retain the physically validated V4.1/V4.3/V4.4 boundaries.
          grep -Fq 'V4_1::support::Keymaster' system/vold/Keymaster.h
          grep -Fq 'KmDevice::enumerateAvailableDevices()' system/vold/Keymaster.cpp
          grep -Fq '[H40 KMCOMPAT] constructor: enumerating Keymaster 4.x devices' system/vold/Keymaster.cpp
          grep -Fq '[H40 BLOBPREFIX] begin:' system/vold/Keymaster.cpp
          grep -Fq '[H40 BLOBPROBE] characteristics:' system/vold/Keymaster.cpp
          grep -Fq '[H40 UPGRADEPARAMS] begin:' system/vold/Keymaster.cpp
          grep -Fq '[H40 UPGRADEPARAMS] upgrade:' system/vold/Keymaster.cpp
          grep -Fq 'if (!opHandle.getUpgradedBlob()) return opHandle;' system/vold/KeyStorage.cpp

          # V4.6 fix 1: installed-system identity, read-only, no hardcoded ROM identity.
          grep -Fq 'DiscoverInstalledSystemIdentity' bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'MS_RDONLY | MS_NOSUID | MS_NODEV | MS_NOEXEC' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'ro.system.build.version.release' bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'ro.system.build.version.security_patch' bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '[H40 PORTIDENTITY] source:' bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '[H40 PORTIDENTITY] applied:' bootable/recovery/oplus_h40_decrypt.cpp
          if grep -Fq 'constexpr char kSystemRelease[] = "14";' bootable/recovery/oplus_h40_decrypt.cpp; then
            echo 'hardcoded V4.5 Android release survived' >&2
            exit 1
          fi
          if grep -Fq 'constexpr char kSystemSecurityPatch[] = "2025-03-01";' \
              bootable/recovery/oplus_h40_decrypt.cpp; then
            echo 'hardcoded V4.5 system SPL survived' >&2
            exit 1
          fi
          if grep -Fq 'RunResetprop("ro.vendor.build.security_patch"' \
              bootable/recovery/oplus_h40_decrypt.cpp; then
            echo 'vendor SPL override is forbidden' >&2
            exit 1
          fi

          # V4.6 fix 2: constructor-safe key-path state.
          grep -Fq 'GetDePolicies()' system/vold/FsCrypt.cpp
          grep -Fq 'GetCePolicies()' system/vold/FsCrypt.cpp
          grep -Fq 'GetEphemeralUsers()' system/vold/FsCrypt.cpp
          grep -Fq 'GetDeKeyRawRef()' system/vold/FsCrypt.cpp
          grep -Fq 'GetFstabDefault()' system/vold/VoldUtil.cpp
          grep -Fq 'GetEmptyAuthentication()' system/vold/KeyStorage.cpp
          grep -Fq 'GetKeyUpgradeLock()' system/vold/KeyStorage.cpp
          grep -Fq 'GetKeyDirsToCommit()' system/vold/KeyStorage.cpp
          grep -Fq '[H40 FSCRYPTLAZY] DE policies ready:' system/vold/FsCrypt.cpp
          grep -Fq '[H40 FSCRYPTLAZY] DE policy insertion complete:' system/vold/FsCrypt.cpp
          if grep -Fq 'std::map<userid_t, EncryptionPolicy> s_de_policies;' system/vold/FsCrypt.cpp; then
            echo 'namespace-scope DE policy map survived' >&2
            exit 1
          fi
          if grep -Fq 'std::map<userid_t, EncryptionPolicy> s_ce_policies;' system/vold/FsCrypt.cpp; then
            echo 'namespace-scope CE policy map survived' >&2
            exit 1
          fi
          if grep -Fq 'static std::mutex key_upgrade_lock;' system/vold/KeyStorage.cpp; then
            echo 'namespace-scope KeyStorage upgrade mutex survived' >&2
            exit 1
          fi
          if grep -Fq 'static std::vector<std::string> key_dirs_to_commit;' \
              system/vold/KeyStorage.cpp; then
            echo 'namespace-scope KeyStorage deferred-directory vector survived' >&2
            exit 1
          fi
          if grep -R -n -F 'fstab_default' system/vold \
              --include='*.cpp' --include='*.cc' --include='*.h'; then
            echo 'namespace-scope/default Fstab reference survived' >&2
            exit 1
          fi

          # V4.6 fix 3: pKMblob-aware wrapped-key export; no key-blob fallback.
          grep -Fq '[H40 BLOBPREFIX] export:' system/vold/Keymaster.cpp
          grep -Fq '[H40 BLOBPREFIX] export result:' system/vold/Keymaster.cpp
          grep -Fq 'UnwrapKs2KeyBlob(storedBlob)' system/vold/Keymaster.cpp
          grep -Fq 'malformed pKMblob prefix' system/vold/Keymaster.cpp
          grep -Fq 'km_hidl::support::blob2hidlVec(' system/vold/Keymaster.cpp
          test "$(grep -Fo 'IsUsableHidlKeyBlob(' system/vold/Keymaster.cpp | wc -l)" -eq 9
          if grep -Fq 'auto keyBlob = blob2hidlVec(' system/vold/Keymaster.cpp; then
            echo 'unqualified blob2hidlVec survived' >&2
            exit 1
          fi
          if grep -Fq 'Using key directly' system/vold/Keymaster.cpp; then
            echo 'unsafe wrapped-key export fallback survived' >&2
            exit 1
          fi
          if grep -Fq 'key->assign(kmKey.begin(), kmKey.end())' system/vold/Keymaster.cpp; then
            echo 'direct use of Keymaster blob as fscrypt key survived' >&2
            exit 1
          fi

          # V4.7 fix 1: create the recovery process's fscrypt session keyring
          # before TWRP enters its metadata/Decrypt_DE path, then recheck it
          # immediately before proprietary setup_de_ce(0).
          grep -Fq '#include <keyutils.h>' bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'keyctl_search(KEY_SPEC_SESSION_KEYRING, "keyring", kName, 0)' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'add_key("keyring", kName, nullptr, 0, KEY_SPEC_SESSION_KEYRING)' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '[H40 FSCRYPTKEYRING] existing:' bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '[H40 FSCRYPTKEYRING] created:' bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '[H40 FSCRYPTKEYRING] ready before TWRP metadata decrypt' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '[H40 FSCRYPTKEYRING] ready before setup_de_ce(0)' \
            bootable/recovery/oplus_h40_decrypt.cpp
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path("bootable/recovery/oplus_h40_decrypt.cpp").read_text()
          runtime_start = adapter.index("Result PrepareMetadataRuntime()")
          runtime_end = adapter.index("\nbool IsActive()", runtime_start)
          runtime_body = adapter[runtime_start:runtime_end]
          assert "if (!EnsureFscryptSessionKeyring())" in runtime_body
          assert "ready before TWRP metadata decrypt" in runtime_body
          assert runtime_body.index("if (!EnsureFscryptSessionKeyring())") < \
                 runtime_body.index("if (api.handle == nullptr)")

          setup_start = adapter.index("bool PrepareUser0DeState(")
          setup_end = adapter.index("\n}  // namespace", setup_start)
          setup_body = adapter[setup_start:setup_end]
          assert setup_body.index("if (!EnsureFscryptSessionKeyring())") < \
                 setup_body.index("const bool setup_succeeded = api.setup_de_ce(0);")

          manager = Path("bootable/recovery/partitionmanager.cpp").read_text()
          decrypt_start = manager.index("void TWPartitionManager::Decrypt_Data()")
          decrypt_end = manager.index("\nint TWPartitionManager::Decrypt_Device(", decrypt_start)
          decrypt_body = manager[decrypt_start:decrypt_end]
          assert decrypt_body.index("twrp::oplus_h40::PrepareMetadataRuntime()") < \
                 decrypt_body.index("android::vold::fscrypt_mount_metadata_encrypted(")
          PY

          # V4.7 fix 2: encryption options/fstab are authoritative. Never
          # invert raw and hardware-wrapped modes after an unrelated failure.
          grep -Fq 'options->version == 1 && entry->fs_mgr_flags.wrapped_key' \
            system/vold/FsCrypt.cpp
          grep -Fq '[H40 FSCRYPTMODE] data options:' system/vold/FsCrypt.cpp
          grep -Fq '[H40 FSCRYPTMODE] system key install failed without mode fallback:' \
            system/vold/FsCrypt.cpp
          grep -Fq '[H40 FSCRYPTMODE] system key installed without mode fallback:' \
            system/vold/FsCrypt.cpp
          for forbidden in \
              'bool retry' \
              '!retry' \
              'Trying %s wrappedkey' \
              'goto install' \
              'fs_mgr_flags.wrapped_key =' \
              'options.use_hw_wrapped_key = !options.use_hw_wrapped_key'; do
            if grep -Fq "$forbidden" system/vold/FsCrypt.cpp; then
              echo "unsafe V4.7 key-mode fallback survived: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Eq '^[[:space:]]*install:$' system/vold/FsCrypt.cpp; then
            echo 'unsafe V4.7 retry label survived' >&2
            exit 1
          fi

          # V4.8: canonical secondary profiles may coexist on disk, but only
          # user 0 may enter the proprietary credential path.
          grep -Fq '[H40 USERMAP] ignoring secondary user id' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'refusing malformed user entry %s/%s' \
            bootable/recovery/oplus_h40_decrypt.cpp
          if grep -Fq 'refusing secondary/unsupported user id' \
              bootable/recovery/oplus_h40_decrypt.cpp; then
            echo 'obsolete all-secondary fatal guard survived' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path("bootable/recovery/oplus_h40_decrypt.cpp").read_text()
          scan_start = adapter.index("bool ScanSingleUserDirectory(")
          scan_end = adapter.index("\nbool ValidateSingleUser0DeLayout()", scan_start)
          scan = adapter[scan_start:scan_end]
          assert scan.count("if (user_id == INT_MAX)") == 1
          assert scan.count("if (user_id != 0)") == 1
          assert scan.index("if (user_id == INT_MAX)") < scan.index("if (user_id != 0)")
          secondary_start = scan.index("if (user_id != 0)")
          secondary_end = scan.index("\n        }", secondary_start)
          secondary = scan[secondary_start:secondary_end]
          assert "errno = 0;" in secondary
          assert secondary.index("errno = 0;") < secondary.index("continue;")
          assert scan.index("if (user_id != 0)") < scan.index("found_user0 = true;")
          assert adapter.count("*user_id = INT_MAX;") == 2

          layout_start = adapter.index("bool ValidateSingleUser0DeLayout()")
          layout_end = adapter.index("\nbool CheckFscryptKeyPresent(", layout_start)
          layout = adapter[layout_start:layout_end]
          required_layout = (
              'CheckReadableFile("/data/unencrypted/key/version")',
              'CheckReadableDirectory("/data/system_de/0")',
              'CheckReadableFile("/data/system/users/0.xml")',
              'ScanSingleUserDirectory("/data/system_de", "", true)',
              'ScanSingleUserDirectory("/data/system/users", "", false)',
              'ScanSingleUserDirectory("/data/system/users", ".xml", true)',
          )
          assert all(item in layout for item in required_layout)

          credential = adapter[adapter.index("Result DecryptUser("):]
          assert "if (user_id != 0)" in credential
          assert "refusing credential for user %d" in credential

          manager = Path("bootable/recovery/partitionmanager.cpp").read_text()
          assert "if (oplus_active && user_id != 0)" in manager
          assert "secondary-user sweep disabled" in manager
          synth_start = manager.index(
              "std::vector<users_struct>* user_list = Get_Users_List()"
          )
          synth_end = manager.index("Check_Users_Decryption_Status();", synth_start)
          synth = manager[synth_start:synth_end]
          assert 'user0.userId = "0";' in synth
          assert synth.count("user_list->push_back(") == 1
          PY

          # V5.1: keep the exact stock credential gate isolated, then retain
          # TeamWin's modern synthetic-password/KeyStorage state in recovery.
          adapter=bootable/recovery/oplus_h40_decrypt.cpp
          adapter_h=bootable/recovery/oplus_h40_decrypt.hpp
          manager=bootable/recovery/partitionmanager.cpp
          client=bootable/recovery/oplus_h40_credential_client.cpp
          helper=bootable/recovery/oplus_h40_credential_helper.cpp
          protocol=bootable/recovery/oplus_h40_credential_protocol.hpp
          android_mk=bootable/recovery/Android.mk
          decrypt=system/vold/Decrypt.cpp
          decrypt_h=system/vold/Decrypt.h
          fscrypt=system/vold/FsCrypt.cpp
          fscrypt_h=system/vold/FsCrypt.h
          permission=system/security/keystore2/src/utils.rs

          for forbidden in \
              'kVerifySymbol' 'using VerifyFn =' 'VerifyFn verify' \
              'loaded.verify' 'api.verify('; do
            if grep -Fq "$forbidden" "$adapter"; then
              echo "in-process V5.0 verifier boundary survived: $forbidden" >&2
              exit 1
            fi
          done
          grep -Fq 'Result::kModernHandoff' "$adapter"
          grep -Fq 'Result::kRejected' "$adapter"
          grep -Fq 'Result::kFatalFailure' "$adapter"
          grep -Fq 'Phase::kAwaitingModernHandoff' "$adapter"
          grep -Fq 'CompleteModernHandoff(bool decrypt_succeeded)' "$adapter"
          grep -Fq 'modern handoff returned without CE key/layout proof' "$adapter"
          grep -Fq 'WaitForAuthorizationEndpoint()' "$adapter"
          grep -Fq 'SetProperty("ctl.start", "keystore2")' "$adapter"
          grep -Fq 'AServiceManager_checkService(kAuthorizationService)' "$adapter"
          grep -Fq 'kModernHandoff' "$adapter_h"
          grep -Fq 'kRejected' "$adapter_h"
          grep -Fq 'kFatalFailure' "$adapter_h"
          grep -Fq '[H40 V51 PARENT] deriving and installing the accepted user 0 credential in the recovery parent' "$manager"
          grep -Fq 'CompleteModernHandoff(modern_decrypt)' "$manager"
          grep -Fq 'android::keystore::Decrypt_User_H40_Modern(user_id, Password)' "$manager"
          if grep -Fq 'RunModernDecryptIsolated' "$manager" || \
              grep -Fq 'ModernDecryptResult' "$manager"; then
            echo 'obsolete forked V5.0 modern-decrypt worker survived' >&2
            exit 1
          fi
          grep -Fq 'bool authorization_failed = false;' "$decrypt"
          grep -Fq 'if (!hwRet.isOk() || authorization_failed)' "$decrypt"
          grep -Fq 'if (!binder_result.isOk())' "$decrypt"
          grep -Fq 'Decrypt_User_H40_Modern' "$decrypt"
          grep -Fq 'Decrypt_User_H40_Modern' "$decrypt_h"
          grep -Fq 'Decrypt_User_Synth_Pass_Impl' "$decrypt"
          grep -Fq 'fscrypt_unlock_user0_key_current_only(secret)' "$decrypt"
          grep -Fq 'fscrypt_unlock_user0_key_current_only' "$fscrypt"
          grep -Fq 'fscrypt_unlock_user0_key_current_only' "$fscrypt_h"
          grep -Fq '[H40 V51 CURRENT]' "$fscrypt"
          grep -Fq '[H40 V51 FORCEDOP] requesting an ordinary Keystore2 operation' "$decrypt"
          grep -Fq 'const bool forced_operation = !h40_current_only;' "$decrypt"
          grep -Fq 'begin_params.vector_data(), forced_operation,' "$decrypt"
          grep -Fq 'H40_RECOVERY_KEYSTORE2_PERMISSION_SHIM_V51' "$permission"
          grep -Fq 'calling_uid == 0 && calling_sid.to_bytes() == H40_RECOVERY_CALLER_SID' "$permission"
          grep -Fq 'key.domain == Domain::SELINUX' "$permission"
          grep -Fq 'key.nspace == H40_LOCKSETTINGS_NAMESPACE' "$permission"
          grep -Fq 'perm == KeystorePerm::add_auth()' "$permission"
          grep -Fq 'perm == KeyPerm::get_info() || perm == KeyPerm::use_()' "$permission"
          if grep -Fq 'begin_params.vector_data(), true,' "$decrypt"; then
            echo 'unconditional forced Keystore2 operation survived V5.1' >&2
            exit 1
          fi

          grep -Fq 'socketpair(AF_UNIX, SOCK_SEQPACKET | SOCK_CLOEXEC' "$client"
          grep -Fq 'posix_spawn_file_actions_adddup2' "$client"
          grep -Fq 'POSIX_SPAWN_SETSIGMASK' "$client"
          grep -Fq 'CaptureHelperMaps' "$client"
          grep -Fq 'stockLibcrypto' "$client"
          grep -Fq 'reply.result == -1' "$client"
          grep -Fq 'SecureWipe(credential_packet.data()' "$client"
          grep -Fq '/tmp/h40-credential-helper-crash.txt' "$client"
          for forbidden in \
              'system(' 'fork(' 'popen(' 'LD_LIBRARY_PATH' 'credential.c_str()' \
              '/tmp/h40-credential-helper.maps' 'SaveHelperMaps'; do
            if grep -Fq "$forbidden" "$client"; then
              echo "unsafe V5.0 client mechanism present: $forbidden" >&2
              exit 1
            fi
          done

          grep -Fq 'kOemLibraryPath[] = "/system/lib64/libdecrypt_recovery.so"' "$protocol"
          grep -Fq 'sizeof(ReplyFrame) == 40' "$protocol"
          grep -Fq 'sizeof(CrashFrame) == 64' "$protocol"
          grep -Fq 'kMaxCredentialBytes = 1024' "$protocol"
          grep -Fq 'kProtocolFd = 3' "$protocol"
          grep -Fq 'kReplyOemIdentityVerified' "$protocol"
          grep -Fq 'program_counter_offset' "$protocol"
          grep -Fq 'link_register_offset' "$protocol"
          grep -Fq 'address_flags' "$protocol"
          grep -Fq 'VerifyOemFileIdentity()' "$helper"
          grep -Fq 'kExpectedOemFileSize = 1479432' "$helper"
          grep -Fq 'kVerifySymbolOffset = 0x826ec' "$helper"
          grep -Fq 'kCredentialLogCallOffset = 0x82adc' "$helper"
          grep -Fq 'kLegacyCeInitCallOffset = 0x82bb0' "$helper"
          grep -Fq 'kCredentialLogCallInstruction = 0x9403648d' "$helper"
          grep -Fq 'kLegacyCeInitCallInstruction = 0x940365d8' "$helper"
          grep -Fq 'kAarch64MovW0One = 0x52800020' "$helper"
          grep -Fq 'SymbolHasExpectedOrigin' "$helper"
          grep -Fq 'ApplyVerifierPatches' "$helper"
          grep -Fq 'VerifierOpcodeContextMatches' "$helper"
          grep -Fq 'CloseInheritedFileDescriptors' "$helper"
          grep -Fq 'SecureWipeString(&credential)' "$helper"
          grep -Fq 'PR_SET_PDEATHSIG' "$helper"
          grep -Fq 'PR_SET_DUMPABLE' "$helper"
          grep -Fq 'verify_result == -1' "$helper"
          grep -Fq 'context->uc_mcontext.regs[30]' "$helper"
          grep -Fq 'context->uc_mcontext.pc' "$helper"
          grep -Fq 'write(protocol::kProtocolFd, &crash, sizeof(crash))' "$helper"
          for forbidden in \
              'kInitUser0CeSymbol' 'InitUser0CeFn' 'init_user0_ce()' \
              'context->uc_mcontext.regs[index]' 'context->uc_mcontext.sp' \
              'context->uc_mcontext.pstate' 'fault_address' 'processor_state'; do
            if grep -Fq "$forbidden" "$helper" || grep -Fq "$forbidden" "$protocol"; then
              echo "unsafe V5.0 helper diagnostic/init mechanism present: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Fq 'explicit_bzero(' "$client" || grep -Fq 'explicit_bzero(' "$helper"; then
            echo 'Android 12L-incompatible explicit_bzero survived' >&2
            exit 1
          fi

          grep -Fq 'LOCAL_REQUIRED_MODULES += oplus_h40_credential_helper' "$android_mk"
          grep -Fq 'LOCAL_MODULE := oplus_h40_credential_helper' "$android_mk"
          grep -Fq 'LOCAL_MULTILIB := 64' "$android_mk"
          grep -Fq 'LOCAL_MODULE_PATH := $(TARGET_RECOVERY_ROOT_OUT)/system/bin' "$android_mk"
          grep -Fq 'LOCAL_SHARED_LIBRARIES := libc++ libdl liblog libkeyutils libcrypto' "$android_mk"
          grep -Fq '# H.40 V5.0 exact credential gate.' "$android_mk"

          python3 - <<'PY'
          from pathlib import Path

          adapter = Path("bootable/recovery/oplus_h40_decrypt.cpp").read_text()
          manager = Path("bootable/recovery/partitionmanager.cpp").read_text()
          client = Path("bootable/recovery/oplus_h40_credential_client.cpp").read_text()
          helper = Path("bootable/recovery/oplus_h40_credential_helper.cpp").read_text()
          protocol = Path("bootable/recovery/oplus_h40_credential_protocol.hpp").read_text()

          credential = adapter[adapter.index("Result DecryptUser("):]
          verify_boundary = "VerifyCredentialIsolated(password, state.user0.raw_password_type)"
          assert credential.count(verify_boundary) == 1
          accepted = credential[credential.index(verify_boundary):credential.index("Result CompleteModernHandoff")]
          assert "api.init_user0_ce()" not in accepted
          assert "ValidateUser0CeLayout()" not in accepted
          assert "state.phase = Phase::kAwaitingModernHandoff" in accepted
          completion = credential[credential.index("Result CompleteModernHandoff"):]
          assert completion.index("decrypt_succeeded") < completion.index("ValidateUser0CeLayout()")

          dispatch = manager[manager.index("bool decrypt_success = false;"):]
          dispatch = dispatch[:dispatch.index("if (decrypt_success)")]
          assert dispatch.count("DecryptUser(Password, user_id)") == 1
          assert dispatch.count("android::keystore::Decrypt_User_H40_Modern(user_id, Password)") == 1
          assert dispatch.count("CompleteModernHandoff(modern_decrypt)") == 1
          rejected = dispatch[dispatch.index("Result::kRejected"):dispatch.index("Result::kFatalFailure")]
          fatal = dispatch[dispatch.index("Result::kFatalFailure"):dispatch.index("else if (oplus_active)")]
          assert "Decrypt_User_H40_Modern" not in rejected
          assert "Decrypt_User_H40_Modern" not in fatal
          assert "RunModernDecryptIsolated" not in manager
          assert "ModernDecryptResult" not in manager

          assert "posix_spawn(" in client and "fork(" not in client
          assert "reply.result == -1" in client
          assert "std::uint64_t registers[31]" not in protocol
          assert "std::uint64_t stack_pointer" not in protocol
          assert "std::uint64_t fault_address" not in protocol
          assert "std::uint64_t link_register_offset" in protocol
          assert "std::uint64_t program_counter_offset" in protocol
          assert "std::uint32_t address_flags" in protocol
          assert "std::uint64_t oem_load_base" not in protocol

          main = helper[helper.index("int main()") :]
          verify_call = "verify(credential, 0)"
          assert main.count(verify_call) == 1
          assert main.index("VerifyOemFileIdentity()") < main.index("dlopen(")
          assert main.index("setup_de_ce(0)") < main.index("ApplyVerifierPatches(")
          assert main.index("ApplyVerifierPatches(") < main.index("ReadCredential(")
          assert main.index("PR_SET_DUMPABLE") < main.index(verify_call)
          assert main.index(verify_call) < main.index("SecureWipeString(&credential)", main.index(verify_call))
          assert "init_user0_ce" not in main
          assert "verify_result == -1" in main
          PY

          # Default branch invariant is checked again after all source transforms.
          actual=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/android-12.1 | awk '{print $1}')
          test "$actual" = "$IMMUTABLE_DEFAULT_SHA"

          printf '\n# CI-only: compile/link the H.40 V5.1 parent-keystorage adapter.\n' \
            >> "$DEVICE_PATH/BoardConfig.mk"
          printf 'TW_INCLUDE_OPLUS_H40_DECRYPT := true\n' >> "$DEVICE_PATH/BoardConfig.mk"

          actual_vold_tree=$(git -C system/vold write-tree)
          test "$v49_vold_tree" = "$V47_VOLD_TREE"
          test "$actual_vold_tree" != "$V47_VOLD_TREE"

          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_revision=${GITHUB_SHA}"
            echo "immutable_default=${IMMUTABLE_DEFAULT_SHA}"
            echo "recovery_base=$RECOVERY_REVISION"
            echo "vold_base=$VOLD_REVISION"
            echo "security_base=$SECURITY_REVISION"
            echo "hidl_reference=$HIDL_REFERENCE_REVISION"
            echo "v3_patch_sha256=$(sha256sum "$v3_patch" | awk '{print $1}')"
            echo "v42_blobprobe_sha256=$(sha256sum "$blobprobe" | awk '{print $1}')"
            echo "v46_portidentity_sha256=$(sha256sum "$portidentity" | awk '{print $1}')"
            echo "v46_fscrypt_lazy_sha256=$(sha256sum "$fscrypt_lazy" | awk '{print $1}')"
            echo "v46_export_prefix_sha256=$(sha256sum "$export_prefix" | awk '{print $1}')"
            echo "v46_composite_sha256=$(sha256sum "$v46" | awk '{print $1}')"
            echo "v47_keyring_sha256=$(sha256sum "$v47_keyring" | awk '{print $1}')"
            echo "v47_composite_sha256=$(sha256sum "$v47" | awk '{print $1}')"
            echo "v48_secondary_user_sha256=$(sha256sum "$v48_secondary_user" | awk '{print $1}')"
            echo "v48_composite_sha256=$(sha256sum "$v48" | awk '{print $1}')"
            echo "v49_credential_helper_sha256=$(sha256sum "$v49_helper" | awk '{print $1}')"
            echo "v49_composite_sha256=$(sha256sum "$v49" | awk '{print $1}')"
            echo "v49_protocol_sha256=$(sha256sum "$v49_assets/oplus_h40_credential_protocol.hpp" | awk '{print $1}')"
            echo "v49_client_header_sha256=$(sha256sum "$v49_assets/oplus_h40_credential_client.hpp" | awk '{print $1}')"
            echo "v49_client_sha256=$(sha256sum "$v49_assets/oplus_h40_credential_client.cpp" | awk '{print $1}')"
            echo "v49_helper_source_sha256=$(sha256sum "$v49_assets/oplus_h40_credential_helper.cpp" | awk '{print $1}')"
            echo "v50_modern_keystorage_sha256=$(sha256sum "$v50_modern_keystorage" | awk '{print $1}')"
            echo "v50_composite_sha256=$(sha256sum "$v50" | awk '{print $1}')"
            echo "v50_protocol_sha256=$(sha256sum "$v50_assets/oplus_h40_credential_protocol.hpp" | awk '{print $1}')"
            echo "v50_client_header_sha256=$(sha256sum "$v50_assets/oplus_h40_credential_client.hpp" | awk '{print $1}')"
            echo "v50_client_sha256=$(sha256sum "$v50_assets/oplus_h40_credential_client.cpp" | awk '{print $1}')"
            echo "v50_helper_source_sha256=$(sha256sum "$v50_assets/oplus_h40_credential_helper.cpp" | awk '{print $1}')"
            echo "v51_parent_keystorage_sha256=$(sha256sum "$v51_parent" | awk '{print $1}')"
            echo "v51_keystore_policy_sha256=$(sha256sum "$v51_policy" | awk '{print $1}')"
            echo "v51_keystore_policy_validator_sha256=$(sha256sum "$v51_policy_validator" | awk '{print $1}')"
            echo "v51_keystore2_packager_sha256=$(sha256sum "$v51_packager" | awk '{print $1}')"
            echo "recovery_tree=$(git -C bootable/recovery write-tree)"
            echo "v49_vold_tree=$v49_vold_tree"
            echo "vold_tree=$actual_vold_tree"
            echo "metadata_keymaster=V4.5_identity_dynamicized"
            echo "fscrypt_state=lazy_first_use"
            echo "key_upgrade_state=lazy_first_use"
            echo "malformed_pKMblob=fail_closed"
            echo "wrapped_export=pKMblob_unwrap_fail_closed"
            echo "fscrypt_session_keyring=required_before_metadata_de"
            echo "file_key_mode=explicit_no_runtime_inversion"
            echo "secondary_profiles=canonical_ignored_user0_only"
            echo "malformed_user_ids=fail_closed"
            echo "credential_verifier=exact_sha_stock_runtime_exec_helper"
            echo "credential_transport=seqpacket_no_argv_env_files"
            echo "credential_crash=redacted_pc_lr_offsets_only"
            echo "credential_retry=oem_minus_one_no_modern_handoff"
            echo "oem_credential_log=suppressed_by_exact_opcode_patch"
            echo "oem_legacy_ce_init=suppressed_by_exact_opcode_patch"
            echo "credential_success=modern_sp_handoff_plus_parent_ce_key_proof"
            echo "modern_decrypt=recovery_parent_current_only"
            echo "keystore_authorization=required_ready_endpoint"
            echo "modern_keystorage=teamwin_decrypt_user_h40_modern"
            echo "keystore2_runtime=same_build_private_dt_needed_closure"
            echo "keystore2_policy=exact_recovery_sid_compatibility_shim"
            echo "keystore2_contexts=stock_type_merge_only"
          } | tee "$GITHUB_WORKSPACE/build-provenance.txt"

          git -C bootable/recovery diff --cached --stat | tee "$GITHUB_WORKSPACE/recovery-diffstat.txt"
          git -C system/vold diff --cached --stat | tee "$GITHUB_WORKSPACE/vold-diffstat.txt"
          git -C system/security diff --cached --stat | tee "$GITHUB_WORKSPACE/security-diffstat.txt"
          git -C system/vold diff --cached > "$GITHUB_WORKSPACE/vold-v51-parent-keystorage.patch"
          git -C bootable/recovery diff --cached > "$GITHUB_WORKSPACE/recovery-v51-parent-keystorage.patch"
          git -C system/security diff --cached > "$GITHUB_WORKSPACE/security-v51-keystore-policy.patch"

      - name: Configure build
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          test "$(get_build_var TW_INCLUDE_OPLUS_H40_DECRYPT)" = true
          test "$(get_build_var TW_EXTRA_LANGUAGES)" = true

      - name: Compile and link recovery
        id: build
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          mka recovery -j"$BUILD_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package V5.1 runtime and private keystore2 closure
        id: runtime_package
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          recovery_root="$RUNNER_TEMP/twrp/out/target/product/guacamole/recovery/root"
          binary="$recovery_root/system/bin/recovery"
          helper="$recovery_root/system/bin/oplus_h40_credential_helper"
          packager="$RUNNER_TEMP/twrp/$DEVICE_PATH/ci/package-h40-v51-keystore2-runtime.py"
          test -x "$binary"
          test -x "$helper"
          test -x "$recovery_root/system/bin/keystore2"

          payload="$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload"
          mkdir -p "$payload"
          install -m 0755 "$binary" "$payload/recovery"
          install -m 0755 "$helper" "$payload/oplus_h40_credential_helper"
          python3 "$packager" \
            --recovery-root "$recovery_root" \
            --output "$payload/keystore2-runtime" \
            --source-date-epoch 0
          cat > "$payload/INSTALL-MANIFEST.txt" <<'EOF'
          guacamole H.40 V5.1 runtime payload

          recovery
            artifact mode: 0755
            final path: /system/tw/bin/recovery
            repack rule: apply the established private-runtime PT_INTERP/dependency rewrite

          oplus_h40_credential_helper
            artifact mode: 0755
            final path: /system/bin/oplus_h40_credential_helper
            repack rule: copy byte-for-byte; do not change PT_INTERP or relocate into /system/tw

          keystore2-runtime
            same-build private linker and exact recursive DT_NEEDED closure
            apply install-root paths and the merge-only context-shim operations
            require companion marker H40_RECOVERY_KEYSTORE2_PERMISSION_SHIM_V51
            preserve all unrelated stock SELinux context lines

          Final repack must resolve the helper's complete dependency closure only against
          preserved stock /system/lib64 and must reject any /system/tw/lib64 resolution.
          The helper intentionally accepts only H.40 libdecrypt_recovery.so SHA-256
          d7ff4888d88040596b7ca6c11ee989893b6cef91ba5651202961716f8e7de2a2.
          EOF
          (
            cd "$GITHUB_WORKSPACE"
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -czf guacamole-h40-v51-runtime-payload.tar.gz \
              guacamole-h40-v51-runtime-payload
          )
          sha256sum "$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload.tar.gz" \
            | tee "$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload.tar.gz.sha256"
          tar -tvzf "$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload.tar.gz" \
            | tee "$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload.files"
          grep -Eq '^-rwxr-xr-x .* guacamole-h40-v51-runtime-payload/recovery$' \
            "$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload.files"
          grep -Eq '^-rwxr-xr-x .* guacamole-h40-v51-runtime-payload/oplus_h40_credential_helper$' \
            "$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload.files"
          grep -Eq '^-rwxr-xr-x .* guacamole-h40-v51-runtime-payload/keystore2-runtime/install-root/system/tw/bin/keystore2$' \
            "$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload.files"
          grep -Eq '^-rw-r--r-- .* guacamole-h40-v51-runtime-payload/keystore2-runtime/MANIFEST.json$' \
            "$GITHUB_WORKSPACE/guacamole-h40-v51-runtime-payload.files"

      - name: Upload successfully packaged V5.1 runtime
        if: ${{ always() && steps.build.outcome == 'success' && hashFiles('guacamole-h40-v51-runtime-payload.tar.gz') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-h40-v51-parent-keystorage-runtime
          if-no-files-found: error
          path: |
            guacamole-h40-v51-runtime-payload.tar.gz
            guacamole-h40-v51-runtime-payload.tar.gz.sha256
            guacamole-h40-v51-runtime-payload/INSTALL-MANIFEST.txt
            guacamole-h40-v51-runtime-payload/keystore2-runtime/MANIFEST.json
            guacamole-h40-v51-runtime-payload/keystore2-runtime/SHA256SUMS

      - name: Verify V5.1 ELF and stock-runtime helper contract
        id: elf_gate
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          recovery_root="$RUNNER_TEMP/twrp/out/target/product/guacamole/recovery/root"
          binary="$recovery_root/system/bin/recovery"
          helper="$recovery_root/system/bin/oplus_h40_credential_helper"
          keystore2="$recovery_root/system/bin/keystore2"
          test -x "$binary"
          test -x "$helper"
          test -x "$keystore2"
          strings -a "$binary" > "$GITHUB_WORKSPACE/recovery.strings"
          readelf --file-header --wide "$binary" > "$GITHUB_WORKSPACE/recovery.header"
          readelf --dynamic --wide "$binary" > "$GITHUB_WORKSPACE/recovery.dynamic"
          awk '/\(NEEDED\)/ { line=$0; sub(/^.*Shared library: \[/,"",line); sub(/\].*$/,"",line); print line }' \
            "$GITHUB_WORKSPACE/recovery.dynamic" > "$GITHUB_WORKSPACE/recovery.dt-needed"
          strings -a "$helper" > "$GITHUB_WORKSPACE/credential-helper.strings"
          readelf --file-header --wide "$helper" > "$GITHUB_WORKSPACE/credential-helper.header"
          readelf --program-headers --wide "$helper" \
            > "$GITHUB_WORKSPACE/credential-helper.program-headers"
          readelf --dynamic --wide "$helper" > "$GITHUB_WORKSPACE/credential-helper.dynamic"
          awk '/\(NEEDED\)/ { line=$0; sub(/^.*Shared library: \[/,"",line); sub(/\].*$/,"",line); print line }' \
            "$GITHUB_WORKSPACE/credential-helper.dynamic" \
            > "$GITHUB_WORKSPACE/credential-helper.dt-needed"
          strings -a "$keystore2" > "$GITHUB_WORKSPACE/keystore2.strings"
          readelf --file-header --wide "$keystore2" > "$GITHUB_WORKSPACE/keystore2.header"

          for marker in \
            '[H40 KMCOMPAT] constructor: enumerating Keymaster 4.x devices' \
            '[H40 KMCOMPAT] retrieve: constructing Keymaster' \
            '[H40 BLOBPREFIX] begin:' \
            '[H40 BLOBPROBE] characteristics:' \
            '[H40 UPGRADEPARAMS] begin:' \
            '[H40 UPGRADEPARAMS] upgrade:' \
            '[H40 PORTIDENTITY] source:' \
            '[H40 PORTIDENTITY] applied:' \
            '[H40 FSCRYPTLAZY] DE policies ready:' \
            '[H40 FSCRYPTLAZY] DE policy insertion complete:' \
            '[H40 BLOBPREFIX] export:' \
            '[H40 BLOBPREFIX] export result:' \
            '[H40 FSCRYPTKEYRING] existing:' \
            '[H40 FSCRYPTKEYRING] created:' \
            '[H40 FSCRYPTKEYRING] ready before TWRP metadata decrypt' \
            '[H40 FSCRYPTKEYRING] ready before setup_de_ce(0)' \
            '[H40 FSCRYPTMODE] data options:' \
            '[H40 FSCRYPTMODE] system key install failed without mode fallback:' \
            '[H40 FSCRYPTMODE] system key installed without mode fallback:' \
            '[H40 USERMAP] ignoring secondary user id %d from %s/%s; user0-only decrypt remains enforced' \
            'Oplus H.40 user0-only mode refusing malformed user entry %s/%s' \
            '[H40 V50 HANDOFF] launching exact-H.40 isolated credential gate for user 0' \
            '[H40 V50 HANDOFF] OEM credential accepted; requesting modern SP unwrap' \
            '[H40 V51 PARENT] deriving and installing the accepted user 0 credential in the recovery parent' \
            '[H40 V51 FORCEDOP] requesting an ordinary Keystore2 operation' \
            '[H40 V51 CURRENT] guarded parent-process CE install' \
            '[H40 V51 CURRENT] installed user 0 CE key without key-directory mutation' \
            '[H40 V50 HANDOFF] modern user 0 CE postcondition satisfied' \
            '[H40 V50 HELPER] OEM verify started attempt=%llu' \
            '[H40 V50 CRASH] helper pid=%d tid=%u signal=%d code=%d stage=%u' \
            'isolated OEM credential gate failed ambiguously' \
            'modern synthetic-password handoff failed after OEM acceptance' \
            'modern handoff returned without CE key/layout proof' \
            'malformed pKMblob prefix'; do
            if ! grep -Fq "$marker" "$GITHUB_WORKSPACE/recovery.strings"; then
              echo "missing required recovery ELF marker: $marker" >&2
              exit 1
            fi
          done

          if ! grep -Fq 'H40_RECOVERY_KEYSTORE2_PERMISSION_SHIM_V51' \
              "$GITHUB_WORKSPACE/keystore2.strings"; then
            echo 'missing recovery-only Keystore2 permission shim in final daemon' >&2
            exit 1
          fi
          test "$(awk '$1 == "Type:" { print $2 }' "$GITHUB_WORKSPACE/keystore2.header")" = DYN
          test "$(awk '$1 == "Class:" { print $2 }' "$GITHUB_WORKSPACE/keystore2.header")" = ELF64
          test "$(awk '$1 == "Machine:" { print $2 }' "$GITHUB_WORKSPACE/keystore2.header")" = AArch64

          grep -Fqx 'android.hardware.keymaster@4.0.so' "$GITHUB_WORKSPACE/recovery.dt-needed"
          grep -Fqx 'android.hardware.keymaster@4.1.so' "$GITHUB_WORKSPACE/recovery.dt-needed"
          grep -Fqx 'libkeymaster4support.so' "$GITHUB_WORKSPACE/recovery.dt-needed"
          grep -Fqx 'libkeymaster4_1support.so' "$GITHUB_WORKSPACE/recovery.dt-needed"
          grep -Fqx 'libkeyutils.so' "$GITHUB_WORKSPACE/recovery.dt-needed"
          grep -Fqx 'libdl.so' "$GITHUB_WORKSPACE/recovery.dt-needed"
          if grep -Fqx 'libdecrypt_recovery.so' "$GITHUB_WORKSPACE/recovery.dt-needed"; then
            echo 'forbidden hard DT_NEEDED on libdecrypt_recovery.so' >&2
            exit 1
          fi
          for marker in \
              'libdecrypt_recovery.so' \
              '_Z11setup_de_cei' \
              '_Z17get_password_typei' \
              '_Z21fscrypt_init_user0_cev' \
              '_Z32fscrypt_mount_metadata_encryptedRKNSt3__112basic_stringIcNS_11char_traitsIcEENS_9allocatorIcEEEE' \
              'vendor.oplus.hardware.cryptoeng@1.0::ICryptoeng' \
              '/data/system_ce/0' \
              '/data/media/0' \
              'I:Oplus H.40 decrypt ABI loaded' \
              'I:Oplus H.40 v4 hybrid activated; TWRP owns metadata mapping, OEM owns DE/CE' \
              'E:Oplus H.40 v5 hybrid adapter entered process-lifetime fatal state: %s' \
              'I:Oplus H.40 v3 FS_IOC_GET_ENCRYPTION_KEY_STATUS PRESENT for %s: status=%u'; do
            if ! grep -Fq "$marker" "$GITHUB_WORKSPACE/recovery.strings"; then
              echo "missing required recovery ABI marker: $marker" >&2
              exit 1
            fi
          done
          private_verify='_Z21OplusCredentialVerifyNSt3__112basic_stringIcNS_11char_traitsIcEENS_9allocatorIcEEEEi'
          if grep -Fq "$private_verify" "$GITHUB_WORKSPACE/recovery.strings"; then
            echo 'OEM credential verifier survived in the private recovery process' >&2
            exit 1
          fi
          if grep -Fq 'Using key directly' "$GITHUB_WORKSPACE/recovery.strings"; then
            echo 'unsafe wrapped-key export fallback is present in final ELF' >&2
            exit 1
          fi
          if grep -Fq 'Trying %s wrappedkey' "$GITHUB_WORKSPACE/recovery.strings"; then
            echo 'unsafe raw/wrapped retry is present in final ELF' >&2
            exit 1
          fi
          if grep -Fq '2025-03-01' "$GITHUB_WORKSPACE/recovery.strings"; then
            echo 'V4.5 hardcoded system SPL survived in final ELF' >&2
            exit 1
          fi
          if grep -Fq 'refusing secondary/unsupported user id' \
              "$GITHUB_WORKSPACE/recovery.strings"; then
            echo 'obsolete all-secondary fatal guard is present in final ELF' >&2
            exit 1
          fi

          test "$(awk '$1 == "Type:" { print $2 }' "$GITHUB_WORKSPACE/credential-helper.header")" = DYN
          test "$(awk '$1 == "Class:" { print $2 }' "$GITHUB_WORKSPACE/credential-helper.header")" = ELF64
          test "$(awk '$1 == "Machine:" { print $2 }' "$GITHUB_WORKSPACE/credential-helper.header")" = AArch64
          grep -Fq 'Requesting program interpreter: /system/bin/linker64' \
            "$GITHUB_WORKSPACE/credential-helper.program-headers"
          for dependency in libc++.so libcrypto.so libdl.so liblog.so libkeyutils.so; do
            grep -Fqx "$dependency" "$GITHUB_WORKSPACE/credential-helper.dt-needed"
          done
          if grep -Fqx 'libdecrypt_recovery.so' \
              "$GITHUB_WORKSPACE/credential-helper.dt-needed"; then
            echo 'helper has forbidden hard DT_NEEDED on libdecrypt_recovery.so' >&2
            exit 1
          fi
          if grep -Eq '\((RPATH|RUNPATH)\)' "$GITHUB_WORKSPACE/credential-helper.dynamic"; then
            echo 'helper has a forbidden RPATH/RUNPATH' >&2
            exit 1
          fi
          while IFS= read -r dependency; do
            case "$dependency" in
              libc++.so|libc.so|libcrypto.so|libdl.so|libkeyutils.so|liblog.so|libm.so) ;;
              *)
                echo "unexpected helper DT_NEEDED entry: $dependency" >&2
                exit 1
                ;;
            esac
          done < "$GITHUB_WORKSPACE/credential-helper.dt-needed"
          for marker in \
              '/system/lib64/libdecrypt_recovery.so' \
              '_Z21OplusCredentialVerifyNSt3__112basic_stringIcNS_11char_traitsIcEENS_9allocatorIcEEEEi' \
              '_Z11setup_de_cei' \
              '_Z17get_password_typei' \
              'stock OEM library identity mismatch' \
              'exact stock OEM library loaded; keyring=%d'; do
            if ! grep -Fq "$marker" "$GITHUB_WORKSPACE/credential-helper.strings"; then
              echo "missing required credential-helper marker: $marker" >&2
              exit 1
            fi
          done
          if grep -Fq '_Z21fscrypt_init_user0_cev' "$GITHUB_WORKSPACE/credential-helper.strings"; then
            echo 'legacy CE initializer symbol survived in helper' >&2
            exit 1
          fi
          if grep -Fq 'base=0x' "$GITHUB_WORKSPACE/credential-helper.strings"; then
            echo 'raw load-address log survived in helper' >&2
            exit 1
          fi
          if grep -Fq '/system/tw/lib64' "$GITHUB_WORKSPACE/credential-helper.strings"; then
            echo 'helper contains a forbidden private-runtime path' >&2
            exit 1
          fi
          sha256sum "$binary" | tee "$GITHUB_WORKSPACE/recovery-v51-parent-keystorage.sha256"
          sha256sum "$helper" | tee "$GITHUB_WORKSPACE/credential-helper-v51.sha256"
          sha256sum "$keystore2" | tee "$GITHUB_WORKSPACE/keystore2-v51.sha256"
          {
            echo 'result=pass'
            echo 'adapter_version=v51-parent-keystorage'
            echo 'recovery_verifier_symbol=absent'
            echo 'helper_verifier_symbol=present'
            echo 'keystore2_recovery_permission_shim=present'
            echo 'recovery_interpreter=private_runtime_repacked_later'
            echo 'helper_interpreter=/system/bin/linker64'
            echo 'helper_binary_uploaded=true'
          } | tee "$GITHUB_WORKSPACE/h40-adapter-verification.txt"

      - name: Verify and package TWRP resources
        id: twres_gate
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          recovery_root="$RUNNER_TEMP/twrp/out/target/product/guacamole/recovery/root"
          twres="$recovery_root/twres"
          device_twres="$RUNNER_TEMP/twrp/$DEVICE_PATH/recovery/root/twres"

          test -d "$twres/languages"
          test -d "$twres/fonts"
          # TW_THEME generates TeamWin's stock splash during compilation. Overlay the
          # device splash and logo explicitly for the ramdisk resource payload.
          install -D -m 0644 "$device_twres/splash.xml" "$twres/splash.xml"
          install -D -m 0644 "$device_twres/images/mirumiru.png" \
            "$twres/images/mirumiru.png"
          cmp "$device_twres/splash.xml" "$twres/splash.xml"
          cmp "$device_twres/images/mirumiru.png" "$twres/images/mirumiru.png"
          for marker in \
              '<image resource="mirumiru"/>' \
              '<text>TWRP %tw_version%</text>' \
              'Latest upstream 12.1 snapshot - 2025-09-02' \
              'Unofficial ColorOS Edition' \
              'OnePlus 7 Series - Guacamole Family'; do
            grep -Fq "$marker" "$twres/splash.xml"
          done

          for language in ja lk zh_CN zh_TW; do
            test -s "$twres/languages/$language.xml"
          done
          for font in DroidSansFallback.ttf NotoSansCJKjp-Regular.ttf Sinhala.ttf; do
            test -s "$twres/fonts/$font"
          done
          grep -Fq '<display>Chinese (Simplified)</display>' "$twres/languages/zh_CN.xml"
          grep -Fq '<display>Chinese (Traditional)</display>' "$twres/languages/zh_TW.xml"

          language_count="$(find "$twres/languages" -maxdepth 1 -type f -name '*.xml' | wc -l)"
          test "$language_count" -eq 23
          (
            cd "$recovery_root"
            find twres -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) | tee "$GITHUB_WORKSPACE/guacamole-h40-v51-twres.sha256"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf "$GITHUB_WORKSPACE/guacamole-h40-v51-twres.tar.gz" \
            -C "$recovery_root" twres
          tar -tzf "$GITHUB_WORKSPACE/guacamole-h40-v51-twres.tar.gz" \
            > "$GITHUB_WORKSPACE/guacamole-h40-v51-twres.files"
          grep -Fxq 'twres/languages/zh_CN.xml' \
            "$GITHUB_WORKSPACE/guacamole-h40-v51-twres.files"
          grep -Fxq 'twres/languages/zh_TW.xml' \
            "$GITHUB_WORKSPACE/guacamole-h40-v51-twres.files"

      - name: Upload V5.1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-h40-v51-parent-keystorage-diagnostics
          if-no-files-found: warn
          path: |
            build.log
            build-provenance.txt
            recovery-diffstat.txt
            vold-diffstat.txt
            security-diffstat.txt
            vold-v51-parent-keystorage.patch
            recovery-v51-parent-keystorage.patch
            security-v51-keystore-policy.patch
            recovery.strings
            recovery.header
            recovery.dynamic
            recovery.dt-needed
            recovery-v51-parent-keystorage.sha256
            credential-helper.strings
            credential-helper.header
            credential-helper.program-headers
            credential-helper.dynamic
            credential-helper.dt-needed
            credential-helper-v51.sha256
            keystore2.strings
            keystore2.header
            keystore2-v51.sha256
            guacamole-h40-v51-runtime-payload.files
            h40-adapter-verification.txt

      - name: Upload V5.1 TWRP resources
        if: ${{ always() && steps.build.outcome == 'success' && steps.twres_gate.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-h40-v51-twres
          if-no-files-found: error
          path: |
            guacamole-h40-v51-twres.tar.gz
            guacamole-h40-v51-twres.files
            guacamole-h40-v51-twres.sha256
