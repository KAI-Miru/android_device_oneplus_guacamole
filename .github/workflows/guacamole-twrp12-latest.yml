name: Build guacamole on current TWRP 12.1

on:
  push:
    branches:
      - codex/guacamole-twrp12-latest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guacamole-twrp12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      DEVICE_PATH: device/oneplus/guacamole
      COMMON_PATH: device/oneplus/sm8150-common
      ONEPLUS_COMMON_PATH: device/oneplus/common
      KERNEL_PATH: kernel/oneplus/sm8150
      BUILD_TARGET: out/target/product/guacamole/ramdisk-recovery.img
      BUILD_JOBS: "4"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush python3 rsync schedtool squashfs-tools xsltproc zip \
            zlib1g-dev
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "TWRP CI"
          git config --global user.email "twrp-ci@users.noreply.github.com"
          df -h

      - name: Initialize current TWRP 12.1 snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" init --depth=1 \
            --manifest-url "$MANIFEST_URL" \
            --manifest-branch "$MANIFEST_BRANCH"

          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/oneplus.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="$DEVICE_PATH"
                     name="${GITHUB_REPOSITORY}"
                     remote="github"
                     revision="${GITHUB_SHA}"
                     clone-depth="1" />
            <project path="$COMMON_PATH"
                     name="TeamWin/android_device_oneplus_sm8150-common"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
            <project path="$ONEPLUS_COMMON_PATH"
                     name="LineageOS/android_device_oneplus_common"
                     remote="github"
                     revision="lineage-18.1"
                     clone-depth="1" />
            <project path="$KERNEL_PATH"
                     name="nebrassy/android_kernel_oneplus_sm8150"
                     remote="github"
                     revision="android-12.1"
                     clone-depth="1" />
          </manifest>
          EOF

          "$HOME/bin/repo" sync --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --fail-fast -j"$BUILD_JOBS"

      - name: Record resolved source snapshot
        run: |
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" manifest -r -o "$GITHUB_WORKSPACE/twrp-snapshot.xml"
          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_revision=${GITHUB_SHA}"
            echo "manifest=$(git -C .repo/manifests rev-parse HEAD)"
            echo "recovery=$(git -C bootable/recovery rev-parse HEAD)"
            echo "vendor_twrp=$(git -C vendor/twrp rev-parse HEAD)"
            echo "build_make=$(git -C build/make rev-parse HEAD)"
            echo "device=$(git -C "$DEVICE_PATH" rev-parse HEAD)"
            echo "sm8150_common=$(git -C "$COMMON_PATH" rev-parse HEAD)"
            echo "oneplus_common=$(git -C "$ONEPLUS_COMMON_PATH" rev-parse HEAD)"
            echo "kernel=$(git -C "$KERNEL_PATH" rev-parse HEAD)"
          } | tee "$GITHUB_WORKSPACE/build-provenance.txt"

      - name: Configure guacamole
        run: |
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          build/soong/soong_ui.bash --dumpvars-mode \
            --vars="TARGET_PRODUCT TARGET_DEVICE TARGET_ARCH PLATFORM_VERSION"

      - name: Build guacamole recovery ramdisk
        id: build
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_guacamole-eng
          mka "$BUILD_TARGET" -j"$BUILD_JOBS" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect successful ramdisk
        if: steps.build.outcome == 'success'
        run: |
          ramdisk="$RUNNER_TEMP/twrp/out/target/product/guacamole/ramdisk-recovery.img"
          test -f "$ramdisk"
          cp "$ramdisk" "$GITHUB_WORKSPACE/twrp-guacamole-current-12.1-ramdisk.img"
          cd "$GITHUB_WORKSPACE"
          sha256sum twrp-guacamole-current-12.1-ramdisk.img \
            | tee twrp-guacamole-current-12.1-ramdisk.img.sha256

      - name: Upload recovery ramdisk
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-current-twrp12-ramdisk
          path: |
            twrp-guacamole-current-12.1-ramdisk.img
            twrp-guacamole-current-12.1-ramdisk.img.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload snapshot and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-current-twrp12-diagnostics
          path: |
            twrp-snapshot.xml
            build-provenance.txt
            build.log
          if-no-files-found: warn
          retention-days: 14

