name: Guacamole H.40 V4.1 kmcompat run locator

on:
  push:
    branches:
      - codex/guacamole-twrp12-v41-kmcompat

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/guacamole-twrp12-v41-kmcompat
          fetch-depth: 1
      - name: Record latest compile run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/guacamole-h40-v41-kmcompat-compile.yml/runs?branch=codex%2Fguacamole-twrp12-v41-kmcompat&per_page=5"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$api" > /tmp/runs.json
          python3 - <<'PY' > ci/v41-kmcompat-run-locator.txt
          import json
          data=json.load(open('/tmp/runs.json'))
          runs=data.get('workflow_runs', [])
          if not runs:
              raise SystemExit('no kmcompat compile runs found')
          r=runs[0]
          for k in ('id','run_number','head_sha','status','conclusion','html_url','created_at','updated_at'):
              print(f"{k}={r.get(k)}")
          PY
          cat ci/v41-kmcompat-run-locator.txt
          git config user.name "TWRP CI"
          git config user.email "twrp-ci@users.noreply.github.com"
          git add ci/v41-kmcompat-run-locator.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record kmcompat run [skip ci]"
          git push origin HEAD:codex/guacamole-twrp12-v41-kmcompat
