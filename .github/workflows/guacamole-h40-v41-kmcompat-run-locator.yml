name: Guacamole H.40 V4.2 blob probe run locator

on:
  push:
    branches:
      - codex/guacamole-twrp12-v42-blobprobe

permissions:
  contents: write
  actions: read

jobs:
  locate:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/guacamole-twrp12-v42-blobprobe
          fetch-depth: 1
      - name: Record completed V4.2 compile run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/guacamole-h40-v41-kmcompat-compile.yml/runs?branch=codex%2Fguacamole-twrp12-v42-blobprobe&per_page=5"
          for attempt in $(seq 1 460); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$api" > /tmp/runs.json
            state="$(python3 - <<'PY'
          import json
          runs=json.load(open('/tmp/runs.json')).get('workflow_runs', [])
          print(runs[0].get('status', '') if runs else '')
          PY
          )"
            if [ "$state" = completed ]; then
              break
            fi
            sleep 30
          done
          python3 - <<'PY' > ci/v42-blobprobe-run-locator.txt
          import json
          data=json.load(open('/tmp/runs.json'))
          runs=data.get('workflow_runs', [])
          if not runs:
              raise SystemExit('no V4.2 blob-probe compile runs found')
          r=runs[0]
          if r.get('status') != 'completed':
              raise SystemExit(f"V4.2 compile did not complete: {r.get('status')}")
          for k in ('id','run_number','head_sha','status','conclusion','html_url','created_at','updated_at'):
              print(f"{k}={r.get(k)}")
          PY
          cat ci/v42-blobprobe-run-locator.txt
          git config user.name "TWRP CI"
          git config user.email "twrp-ci@users.noreply.github.com"
          git add ci/v42-blobprobe-run-locator.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: record V4.2 blob-probe run [skip ci]"
          git push origin HEAD:codex/guacamole-twrp12-v42-blobprobe
